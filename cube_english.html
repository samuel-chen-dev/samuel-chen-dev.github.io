  updateSubmitButtonState();
}

function updateClozeBlankHighlight() {
  document.querySelectorAll('.cloze-blank').forEach(el => {
    el.classList.toggle('current', parseInt(el.dataset.blank) === currentClozeBlank);
  });
}

// ---- 选词填空渲染 ----
function renderWordbankQuestion(q) {
  // 显示短文
  let passageHtml = q.passage;
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const word = wordbankAnswers[num] || '____';
    passageHtml = passageHtml.replace('____', `<span class="wordbank-blank" data-blank="${num}" id="wb-blank-${num}">${word}</span>`);
  });
  document.getElementById('modal-question').innerHTML = `<div class="wordbank-passage">${passageHtml}</div>`;

  // 词库
  const optionsList = document.getElementById('options-list');
  const tagsDiv = document.createElement('div');
  tagsDiv.className = 'wordbank-tags';
  tagsDiv.id = 'wordbank-tags';
  (q.wordBank || []).forEach(word => {
    const tag = document.createElement('span');
    tag.className = 'wordbank-tag';
    tag.textContent = word;
    tag.onclick = () => fillWordbankBlank(word, tag);
    if (Object.values(wordbankAnswers).includes(word)) tag.classList.add('used');
    tagsDiv.appendChild(tag);
  });
  optionsList.appendChild(tagsDiv);

  // 点击空格切换
  document.querySelectorAll('.wordbank-blank').forEach(el => {
    el.addEventListener('click', () => {
      currentWordbankBlank = parseInt(el.dataset.blank);
      updateWordbankBlankHighlight();
    });
  });
  if (q.blanks && q.blanks.length > 0) currentWordbankBlank = 1;
  updateWordbankBlankHighlight();
  updateSubmitButtonState();
}

function fillWordbankBlank(word, tag) {
  if (answered) return;
  // 如果当前空格已有词，先释放旧词
  const oldWord = wordbankAnswers[currentWordbankBlank];
  if (oldWord) {
    document.querySelectorAll('.wordbank-tag').forEach(t => {
      if (t.textContent === oldWord) t.classList.remove('used');
    });
  }
  wordbankAnswers[currentWordbankBlank] = word;
  const blankEl = document.getElementById(`wb-blank-${currentWordbankBlank}`);
  if (blankEl) { blankEl.textContent = word; blankEl.classList.add('filled'); }
  tag.classList.add('used');
  // 跳转到下一个空格
  const q = currentQuestion;
  const nextBlank = currentWordbankBlank + 1;
  if (q.blanks && nextBlank <= q.blanks.length) {
    currentWordbankBlank = nextBlank;
    updateWordbankBlankHighlight();
  }
  updateSubmitButtonState();
}

function updateWordbankBlankHighlight() {
  document.querySelectorAll('.wordbank-blank').forEach(el => {
    el.classList.toggle('current', parseInt(el.dataset.blank) === currentWordbankBlank);
  });
}

// ---- 语法填空渲染 ----
function renderGrammarQuestion(q) {
  let passageHtml = q.passage;
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const hint = blank.hint || '';
    passageHtml = passageHtml.replace(
      `___ (${num})`,
      `<input class="grammar-input" id="grammar-input-${num}" data-blank="${num}" placeholder="空格${num}" value="${grammarAnswers[num] || ''}"><span class="grammar-hint">${hint}</span>`
    );
  });
  document.getElementById('modal-question').innerHTML = `<div class="grammar-passage">${passageHtml}</div>`;
  document.getElementById('options-list').innerHTML = '';

  // 绑定输入事件
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const input = document.getElementById(`grammar-input-${num}`);
    if (input) {
      input.addEventListener('input', () => {
        grammarAnswers[num] = input.value.trim();
        updateSubmitButtonState();
      });
    }
  });
  updateSubmitButtonState();
}

// ---- 提交按钮状态更新 ----
function updateSubmitButtonState() {
  const q = currentQuestion;
  if (!q) return;
  const qType = q.type || 'choice';
  let allFilled = false;
  switch (qType) {
    case 'cloze':
      allFilled = (q.blanks || []).every((_, i) => clozeAnswers[i + 1] !== undefined);
      break;
    case 'wordbank':
      allFilled = (q.blanks || []).every((_, i) => wordbankAnswers[i + 1] !== undefined);
      break;
    case 'grammar':
      allFilled = (q.blanks || []).every((_, i) => (grammarAnswers[i + 1] || '').trim() !== '');
      break;
    default:
      allFilled = selectedOption !== null;
  }
  document.getElementById('btn-submit').disabled = !allFilled;
}

// ---- 提交答案 ----
function submitAnswer() {
  if (!currentQuestion || answered) return;
  const q = currentQuestion;
  const qType = q.type || 'choice';

  // 检查是否全部填写
  let allFilled = false;
  if (qType === 'choice') allFilled = selectedOption !== null;
  else if (qType === 'cloze') allFilled = (q.blanks || []).every((_, i) => clozeAnswers[i + 1] !== undefined);
  else if (qType === 'wordbank') allFilled = (q.blanks || []).every((_, i) => wordbankAnswers[i + 1] !== undefined);
  else if (qType === 'grammar') allFilled = (q.blanks || []).every((_, i) => (grammarAnswers[i + 1] || '').trim() !== '');
  if (!allFilled) return;

  answered = true;
  const feedbackArea = document.getElementById('feedback-area');
  const feedbackMsg = document.getElementById('feedback-message');
  const feedbackExp = document.getElementById('feedback-explanation');
  feedbackArea.classList.add('show');

  let isCorrect = false;

  switch (qType) {
    case 'choice':
      isCorrect = submitChoiceAnswer(q, feedbackMsg, feedbackExp);
      break;
    case 'cloze':
      isCorrect = submitClozeAnswer(q, feedbackMsg, feedbackExp);
      break;
    case 'wordbank':
      isCorrect = submitWordbankAnswer(q, feedbackMsg, feedbackExp);
      break;
    case 'grammar':
      isCorrect = submitGrammarAnswer(q, feedbackMsg, feedbackExp);
      break;
  }

  if (isCorrect) {
    markCompleted(currentFaceId, currentCell.row, currentCell.col);
    removeFromWrongBook(); // 答对后从错题本移除
    checkDailyComplete(); // 检查每日挑战

    // 保留解析，由用户决定何时进入下一关
    const countdownEl = document.createElement('div');
    countdownEl.className = 'countdown-hint';
    countdownEl.innerHTML = `${iconMarkup('circle-check')}<span>当前方块已点亮，可查看解析后继续</span>`;
    feedbackArea.appendChild(countdownEl);

    document.getElementById('btn-submit').style.display = 'none';
    const nextButton = document.getElementById('btn-next');
    const currentOrder = currentCell.row * 3 + currentCell.col;
    nextButton.textContent = currentOrder < 8 ? '下一关' : '完成本面';
    nextButton.style.display = 'block';
  } else {
    document.getElementById('btn-next').textContent = '关闭';
    document.getElementById('btn-next').style.display = 'block';
    addWrongQuestion(q, qType);
  }
  lastAnswerCorrect = isCorrect;
  refreshIcons();

  // 记录答题日志
  logAnswer(isCorrect);

  document.getElementById('btn-submit').style.display = 'none';
}

function submitChoiceAnswer(q, feedbackMsg, feedbackExp) {
  const isCorrect = selectedOption === q.correctIndex;
  const optionBtns = document.querySelectorAll('.option-btn');
  optionBtns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.correctIndex) btn.classList.add('correct');
    if (i === selectedOption && !isCorrect) btn.classList.add('wrong');
  });
  if (isCorrect) {
    feedbackMsg.innerHTML = `<div class="feedback-correct">${iconMarkup('circle-check')}<span>回答正确！</span></div>`;
  } else {
    feedbackMsg.innerHTML = `<div class="feedback-wrong">${iconMarkup('circle-x')}<span>回答错误</span></div>`;
  }
  feedbackExp.textContent = q.explanation || '';
  return isCorrect;
}

function submitClozeAnswer(q, feedbackMsg, feedbackExp) {
  let allCorrect = true;
  const results = [];
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const userIdx = clozeAnswers[num];
    const isCorrect = userIdx === blank.correctIndex;
    if (!isCorrect) allCorrect = false;
    results.push({ num, isCorrect, userAnswer: blank.options[userIdx] || '未作答', correctAnswer: blank.options[blank.correctIndex] });
    // 更新空格样式
    const blankEl = document.getElementById(`cloze-blank-${num}`);
    if (blankEl) blankEl.classList.add(isCorrect ? 'correct-blank' : 'wrong-blank');
    // 更新选项高亮
    const group = document.getElementById(`cloze-options-${num}`);
    if (group) {
      group.querySelectorAll('.cloze-option').forEach((btn, j) => {
        btn.disabled = true;
        if (j === blank.correctIndex) btn.classList.add('correct-opt');
        if (j === userIdx && !isCorrect) btn.classList.add('wrong-opt');
      });
    }
  });
  if (allCorrect) {
    feedbackMsg.innerHTML = `<div class="feedback-correct">${iconMarkup('circle-check')}<span>全部正确！</span></div>`;
  } else {
    const details = results.map(r => `空格${r.num}：${r.userAnswer} → ${r.correctAnswer}（${r.isCorrect ? '正确' : '错误'}）`).join('<br>');
    feedbackMsg.innerHTML = `<div class="feedback-wrong">${iconMarkup('circle-x')}<span>有 ${results.filter(r => !r.isCorrect).length} 个空格回答错误</span></div>`;
    feedbackExp.innerHTML = details;
    return false;
  }
  feedbackExp.textContent = q.explanation || '';
  return true;
}

function submitWordbankAnswer(q, feedbackMsg, feedbackExp) {
  let allCorrect = true;
  const results = [];
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const userAnswer = wordbankAnswers[num] || '';
    const isCorrect = userAnswer.toLowerCase().trim() === blank.correctWord.toLowerCase().trim();
    if (!isCorrect) allCorrect = false;
    results.push({ num, isCorrect, userAnswer, correctAnswer: blank.correctWord });
    const blankEl = document.getElementById(`wb-blank-${num}`);
    if (blankEl) blankEl.classList.add(isCorrect ? 'correct-blank' : 'wrong-blank');
  });
  if (allCorrect) {
    feedbackMsg.innerHTML = `<div class="feedback-correct">${iconMarkup('circle-check')}<span>全部正确！</span></div>`;
  } else {
    const details = results.map(r => `空格${r.num}：${r.userAnswer || '未填'} → ${r.correctAnswer}（${r.isCorrect ? '正确' : '错误'}）`).join('<br>');
    feedbackMsg.innerHTML = `<div class="feedback-wrong">${iconMarkup('circle-x')}<span>有 ${results.filter(r => !r.isCorrect).length} 个空格回答错误</span></div>`;
    feedbackExp.innerHTML = details;
    return false;
  }
  feedbackExp.textContent = q.explanation || '';
  return true;
}

function submitGrammarAnswer(q, feedbackMsg, feedbackExp) {
  let allCorrect = true;
  const results = [];
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const userAnswer = grammarAnswers[num] || '';
    const isCorrect = userAnswer.toLowerCase().trim() === blank.correctAnswer.toLowerCase().trim();
    if (!isCorrect) allCorrect = false;
    results.push({ num, isCorrect, userAnswer, correctAnswer: blank.correctAnswer });
    const input = document.getElementById(`grammar-input-${num}`);
    if (input) { input.classList.add(isCorrect ? 'correct-input' : 'wrong-input'); input.disabled = true; }
  });
  if (allCorrect) {
    feedbackMsg.innerHTML = `<div class="feedback-correct">${iconMarkup('circle-check')}<span>全部正确！</span></div>`;
  } else {
    const details = results.map(r => `空格${r.num}：${r.userAnswer || '未填'} → ${r.correctAnswer}（${r.isCorrect ? '正确' : '错误'}）`).join('<br>');
    feedbackMsg.innerHTML = `<div class="feedback-wrong">${iconMarkup('circle-x')}<span>有 ${results.filter(r => !r.isCorrect).length} 个空格回答错误</span></div>`;
    feedbackExp.innerHTML = details;
    return false;
  }
  feedbackExp.textContent = q.explanation || '';
  return true;

let lastAnswerCorrect = false;

function nextQuestion() {
  // 如果答错，仅关闭弹窗
  if (!answered || !lastAnswerCorrect) {
    closeModal();
    return;
  }

  const completedFaceId = currentFaceId;
  const completedCell = currentCell ? { ...currentCell } : null;
  closeModal();
  if (!completedFaceId || !completedCell) return;

  triggerCompletionAnimation(completedFaceId, completedCell.row, completedCell.col);
  setTimeout(() => advanceToNextQuestion(completedFaceId, completedCell), 650);
}

function advanceToNextQuestion(completedFaceId, completedCell) {
  const nextOrder = completedCell.row * 3 + completedCell.col + 1;
  if (nextOrder < 9) {
    const nextCell = { row: Math.floor(nextOrder / 3), col: nextOrder % 3 };
    if (getCellState(completedFaceId, nextCell.row, nextCell.col) === 'unlocked') {
      focusAndOpenQuestion(completedFaceId, nextCell);
      return;
    }
  }
  checkCompletion();
}

function focusAndOpenQuestion(faceId, cell) {
  faceCameraToCell(faceId, cell, () => {
    const cubie = findCubieForCell(faceId, cell);
    if (cubie) addPulseAnimation(cubie.mesh);
    openQuestionModal(faceId, cell);
  });
}

function closeModal() {
  // 清除定时器
  if (window._modalTimer) {
    clearTimeout(window._modalTimer);
    window._modalTimer = null;
  }
  // 清空选项列表，释放 DOM 引用
  const optionsList = document.getElementById('options-list');
  if (optionsList) optionsList.innerHTML = '';
  // 清除文段
  document.getElementById('modal-passage').style.display = 'none';
  document.getElementById('modal-passage').textContent = '';
  document.getElementById('modal-question').innerHTML = '';
  // 重置状态
  currentQuestion = null;
  selectedOption = null;
  answered = false;
  clozeAnswers = {};
  wordbankAnswers = {};
  grammarAnswers = {};
  // 隐藏弹窗
  document.getElementById('modal-overlay').classList.remove('active');
  const feedbackArea = document.getElementById('feedback-area');
  feedbackArea.classList.remove('show');
  // 清除倒计时提示
  const countdown = feedbackArea.querySelector('.countdown-hint');
  if (countdown) countdown.remove();
}

// ============================================================
// 完成动画：找到对应 cubie 并播放点亮动画
// ============================================================
function triggerCompletionAnimation(faceId, row, col) {
  const face = FACES[faceId];
  const [nx, ny, nz] = face.normal;
  for (const key in cubieMap) {
    const cubie = cubieMap[key];
    if (!cubie.exposed[faceId]) continue;
    const cell = getFaceCell(cubie.x, cubie.y, cubie.z, nx, ny, nz);
    if (cell && cell.row === row && cell.col === col) {
      const { mesh, materials, faceOrder } = cubie;
      addCompletionAnimation(mesh, materials, faceOrder, faceId, face.color);
      break;
    }
  }
}

  let distance = 9;
  if (width < 400) distance = 13;
  else if (width < 600) distance = 11.5;
  else if (width < 768) distance = 10;
  camera.position.normalize().multiplyScalar(distance);
  controls.update();
}

function addWrongQuestion(q, qType) {
  const wrongQuestions = JSON.parse(localStorage.getItem('cube_wrong_questions') || '[]');
  const qId = q.id || `${currentDifficulty}_${currentFaceId}_${currentCell.row}_${currentCell.col}`;
  if (wrongQuestions.find(wq => wq.questionId === qId)) return;
  wrongQuestions.push({
    questionId: qId, faceId: currentFaceId, difficulty: currentDifficulty,
    userAnswer: qType === 'choice' ? (q.options ? q.options[selectedOption] : '') : JSON.stringify(clozeAnswers || wordbankAnswers || grammarAnswers),
    correctAnswer: qType === 'choice' ? (q.options ? q.options[q.correctIndex] : '') : ((q.blanks || []).map(b => b.correctIndex !== undefined ? b.options[b.correctIndex] : (b.correctWord || b.correctAnswer || '')).join(', ')),
    explanation: q.explanation || '', question: q.question || q.passage || '', type: qType, timestamp: Date.now()
  });
  localStorage.setItem('cube_wrong_questions', JSON.stringify(wrongQuestions));
}

let retryQuestionData = null;

window.retryWrongQuestion = function(questionId) {
  const wrongQuestions = JSON.parse(localStorage.getItem('cube_wrong_questions') || '[]');
  const wq = wrongQuestions.find(w => w.questionId === questionId);
  if (!wq) return;
  retryQuestionData = wq;
  if (wq.difficulty && wq.difficulty !== currentDifficulty) {
    currentDifficulty = wq.difficulty;
    localStorage.setItem('cube_english_difficulty', currentDifficulty);
    document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
    const btn = document.querySelector(`.diff-btn[data-diff="${currentDifficulty}"]`);
    if (btn) btn.classList.add('active');
    updateAllCubieColors(); updateDifficultyBadge(); renderer.render(scene, camera);
  }
  faceCameraToFace(wq.faceId, () => {
    const questions = QUESTIONS[currentDifficulty][FACE_TO_QB[wq.faceId]];
    for (let i = 0; i < 9; i++) {
      if (questions[i].id === questionId) {
        openQuestionModal(wq.faceId, { row: Math.floor(i / 3), col: i % 3 });
        return;
      }
    }
  });
  closePanelModal();
};

function logAnswer(isCorrect) {
  const logs = JSON.parse(localStorage.getItem('cube_answer_logs') || '[]');
  logs.push({
    difficulty: currentDifficulty,
    faceId: currentFaceId,
    level: currentCell.row * 3 + currentCell.col + 1,
    questionId: currentQuestion.id || `${currentFaceId}_${currentCell.row}_${currentCell.col}`,
    correct: isCorrect,
    timestamp: Date.now()
  });
  localStorage.setItem('cube_answer_logs', JSON.stringify(logs));
}

function calculateStats() {
  const progress = loadProgress();
  let totalCompleted = 0;
  const faceStats = {};
  const difficultyStats = { easy: 0, medium: 0, hard: 0 };
  for (const key in progress) {
    const parts = key.split('_');
    const diff = parts[0], faceId = parts[1];
    if (difficultyStats[diff] !== undefined) difficultyStats[diff]++;
    if (diff !== currentDifficulty) continue;
    totalCompleted++;
    if (!faceStats[faceId]) faceStats[faceId] = { completed: 0 };
    faceStats[faceId].completed++;
  }
  const faces = Object.keys(FACES).map(faceId => {
    const face = FACES[faceId];
    const s = faceStats[faceId] || { completed: 0 };
    return { name: face.name, color: face.color, completed: s.completed, percent: Math.round((s.completed / 9) * 100) };
  });
  const firstOpen = localStorage.getItem('cube_first_open');
  const now = Date.now();
  if (!firstOpen) localStorage.setItem('cube_first_open', now);
  const elapsed = now - parseInt(firstOpen || now);
  const hours = Math.floor(elapsed / 3600000), minutes = Math.floor((elapsed % 3600000) / 60000);
  const studyTime = hours > 0 ? `${hours}小时${minutes}分钟` : `${minutes}分钟`;

  // 从答题日志计算真实正确率
  const answerLogs = JSON.parse(localStorage.getItem('cube_answer_logs') || '[]');
  const totalAnswers = answerLogs.length;
  const correctAnswers = answerLogs.filter(log => log.correct).length;
  const incorrectAnswers = totalAnswers - correctAnswers;
  const realAccuracy = totalAnswers > 0 ? Math.round((correctAnswers / totalAnswers) * 100) : 0;

  return { totalCompleted, accuracy: realAccuracy, faces, difficultyStats, studyTime, totalAnswers, correctAnswers, incorrectAnswers, realAccuracy };
}

function getTodayStr() { return new Date().toISOString().slice(0, 10); }

function showDailyChallenge() {
  const today = getTodayStr();
  let daily = JSON.parse(localStorage.getItem('cube_daily_challenge') || '{}');

  if (daily.date !== today || daily.difficulty !== currentDifficulty) {

  }
  const content = document.getElementById('panel-content');

  setPanelTitle('calendar-check-2', `今日挑战 · ${diffLabels[currentDifficulty]}`);
  const completed = daily.completed || [];
  const streak = getDailyStreak();
  let html = `<div style="text-align:center;margin-bottom:12px">
    <div style="font-size:0.85rem;color:#aaa">${today}</div>
    <div style="font-size:1.2rem;font-weight:700;color:#4ae6c9">${completed.length}/5 已完成</div>

    html += `<div style="background:rgba(255,255,255,0.04);border-radius:10px;padding:10px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.06)">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><span style="display:inline-flex;color:${isCompleted ? 'var(--success)' : 'var(--text-muted)'}">${iconMarkup(isCompleted ? 'circle-check' : 'circle')}</span><span style="font-size:0.8rem;color:var(--accent)">第${i+1}题</span><span style="font-size:0.7rem;color:var(--text-muted)">${TYPE_LABELS[q.type] || '选择题'}</span></div>
      <div style="font-size:0.8rem;color:#ccc">${q.question || q.passage || ''}</div>`;

    html += `</div>`;
  });

  refreshIcons();
  openPanelModal();
}

function generateDailyChallenge() {
  // 只从当前难度题库中抽取题目
  const allQuestions = [];
  const diff = currentDifficulty;
  for (const face of Object.keys(QUESTIONS[diff])) {
    const qs = QUESTIONS[diff][face];
    for (let i = 0; i < 9; i++) allQuestions.push({ ...qs[i], difficulty: diff, faceId: QB_TO_FACE[face], cellIndex: i });
  }
  return { date: getTodayStr(), difficulty: diff, completed: [], questions: allQuestions.sort(() => Math.random() - 0.5).slice(0, 5), correctCount: 0 };
}

// 换一批：重新生成每日挑战
window.regenerateDailyChallenge = function() {
  const daily = generateDailyChallenge();
  localStorage.setItem('cube_daily_challenge', JSON.stringify(daily));
  showDailyChallenge();
};

let dailyQuestionIndex = -1;

window.startDailyQuestion = function(index) {
  dailyQuestionIndex = index;
  const daily = JSON.parse(localStorage.getItem('cube_daily_challenge') || '{}');
  const q = daily.questions[index];
  if (!q) return;
  closePanelModal();
  // 每日挑战题目已限定在当前难度，无需切换
  faceCameraToFace(q.faceId, () => { openQuestionModal(q.faceId, { row: Math.floor(q.cellIndex / 3), col: q.cellIndex % 3 }); });
};

function getDailyStreak() {
  let streak = 0;
  const today = new Date();
  for (let i = 0; i < 365; i++) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().slice(0, 10);
    const daily = JSON.parse(localStorage.getItem('cube_daily_challenge') || '{}');
    if (daily.date === dateStr && (daily.completed || []).length > 0) streak++;
    else if (i > 0) break;
  }
  return streak;
}

function checkDailyComplete() {
  if (dailyQuestionIndex < 0) return;
  const daily = JSON.parse(localStorage.getItem('cube_daily_challenge') || '{}');
  if (!daily.completed.includes(dailyQuestionIndex)) {
    daily.completed.push(dailyQuestionIndex);
    daily.correctCount = (daily.correctCount || 0) + 1;
    localStorage.setItem('cube_daily_challenge', JSON.stringify(daily));
  }
  dailyQuestionIndex = -1;
}

function createConfetti() {
  const colors = ['#ff6b6b','#feca57','#48dbfb','#4a9eff','#a29bfe','#fdcb6e','#4ae6c9'];
  for (let i = 0; i < 60; i++) {
    const confetti = document.createElement('div');
    confetti.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}%;width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;background:${colors[Math.floor(Math.random()*colors.length)]};border-radius:${Math.random()>0.5?'50%':'2px'};z-index:9999;pointer-events:none;animation:confettiFall ${2+Math.random()*3}s ease-in forwards;animation-delay:${Math.random()*2}s`;
    document.body.appendChild(confetti);
    setTimeout(() => confetti.remove(), 5000);
  }
  if (!document.getElementById('confetti-style')) {
    const style = document.createElement('style');
    style.id = 'confetti-style';
    style.textContent = `@keyframes confettiFall { to { top:110vh; transform:rotate(720deg); opacity:0; } }`;
    document.head.appendChild(style);
  }
}

const themeToggle = document.getElementById('theme-toggle');
const THEME_KEY = 'cube_english_theme';

function getThemeLockColor() {
  // 读取当前主题的锁定颜色，用于 Three.js 魔方渲染
  const style = getComputedStyle(document.documentElement);
  return style.getPropertyValue('--lock-color').trim() || '#1a1a2e';
}

function getThemeUnlockedAlpha() {
  const style = getComputedStyle(document.documentElement);
  return parseFloat(style.getPropertyValue('--lock-unlocked-alpha').trim()) || 0.5;
}

function getThemeCubieInner() {
  const style = getComputedStyle(document.documentElement);
  return style.getPropertyValue('--cubie-inner').trim() || '#1a1a2e';
}

function getThemeEdgeOpacity() {
  // 暗色主题：0.25，亮色主题：0.15
  const theme = document.documentElement.dataset.theme || 'dark';
  return theme === 'light' ? 0.15 : 0.25;
}

function getThemeEdgeColor() {
  const style = getComputedStyle(document.documentElement);
  return style.getPropertyValue('--cubie-edge').trim() || '#566879';
}

function getFaceUiColor(faceId) {
  if (faceId === 'top') return document.documentElement.dataset.theme === 'light' ? '#52646d' : '#f4f1e8';
  if (faceId === 'bottom') return document.documentElement.dataset.theme === 'light' ? '#8a5c08' : FACES[faceId].color;
  return FACES[faceId].color;
}

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  setIconButton(themeToggle, theme === 'light' ? 'moon' : 'sun', theme === 'light' ? '切换为暗色主题' : '切换为亮色主题');
  localStorage.setItem(THEME_KEY, theme);
  // 更新魔方颜色（锁定/解锁状态的颜色随主题变化）
  updateAllCubieColors();
  // 更新边框透明度
  updateAllEdgeOpacity();
}

function toggleTheme() {
  const current = document.documentElement.dataset.theme || 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
}

themeToggle.addEventListener('click', toggleTheme);

// 更新 DARK_COLOR 为动态值（从 CSS 变量读取）
// 注意：必须用 function 声明（会被提升），不能用 const 箭头函数（有 TDZ 问题）
function DARK_COLOR_DYNAMIC() {
  const c = getThemeLockColor();
  return parseInt(c.replace('#', ''), 16);
}

// 更新 halfBrightness 函数以支持可变 alpha
function halfBrightnessDynamic(hex) {
  const alpha = getThemeUnlockedAlpha();
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return '#' + [r, g, b].map(c => Math.round(c * alpha).toString(16).padStart(2, '0')).join('');
}
