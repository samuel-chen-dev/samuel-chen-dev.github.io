<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>魔方英语 - Cube English</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23F0C84B' d='m12 1 10 5.2-10 5.2L2 6.2z'/%3E%3Cpath fill='%23E34850' d='m2 6.2 10 5.2V23L2 17.8z'/%3E%3Cpath fill='%233478D4' d='m12 11.4 10-5.2v11.6L12 23z'/%3E%3Cpath fill='none' stroke='%230d151f' stroke-width='.8' d='M2 6.2 12 1l10 5.2v11.6L12 23 2 17.8ZM12 11.4V23M2 6.2l10 5.2 10-5.2'/%3E%3C/svg%3E">
<style>
/* ============================================================
   全局样式
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============================================================
   CSS 变量 - 主题系统
   ============================================================ */
:root {
  --bg-primary: #080d14;
  --bg-secondary: #111b29;
  --bg-tertiary: #09141c;
  --bg-card: rgba(12,20,31,0.82);
  --bg-card-solid: #121d2a;
  --bg-panel: rgba(10,18,28,0.72);
  --bg-passage: rgba(255,255,255,0.05);
  --bg-item: rgba(255,255,255,0.04);
  --border-color: rgba(255,255,255,0.1);
  --border-light: rgba(255,255,255,0.06);
  --text-primary: #f1f5f4;
  --text-secondary: #aab9c3;
  --text-title: #ffffff;
  --text-muted: #71828d;
  --text-option: #e5ecea;
  --accent: #42dfc0;
  --accent-strong: #24b99f;
  --accent-soft: rgba(66,223,192,0.14);
  --reward: #f0c56a;
  --success: #48c78e;
  --danger: #ff6b6b;
  --btn-bg: rgba(255,255,255,0.04);
  --btn-text: #b2c0ca;
  --btn-active-bg: rgba(66,223,192,0.18);
  --btn-active-text: #fff;
  --btn-hover-bg: rgba(255,255,255,0.1);
  --btn-hover-border: rgba(255,255,255,0.2);
  --modal-bg: rgba(14,23,35,0.96);
  --overlay-bg: rgba(3,8,14,0.84);
  --modal-border: rgba(66,223,192,0.2);
  --option-bg: rgba(255,255,255,0.06);
  --option-text: #ddd;
  --progress-bg: rgba(255,255,255,0.06);
  --hint-color: rgba(255,255,255,0.35);
  --header-bg: rgba(255,255,255,0.06);
  --stat-text: #aab9c3;
  --lock-color: #202e3b;
  --lock-unlocked-alpha: 0.76;
  --cubie-inner: #0d151f;
  --cubie-edge: #566879;
  --confirm-bg: rgba(14,23,35,0.98);
  --confirm-border: rgba(255,255,255,0.12);
}

[data-theme="light"] {
  --bg-primary: #eef3f4;
  --bg-secondary: #ffffff;
  --bg-tertiary: #e7eff1;
  --bg-card: rgba(255,255,255,0.85);
  --bg-card-solid: #ffffff;
  --bg-panel: rgba(255,255,255,0.7);
  --bg-passage: rgba(0,0,0,0.04);
  --bg-item: rgba(0,0,0,0.04);
  --border-color: rgba(0,0,0,0.08);
  --border-light: rgba(0,0,0,0.04);
  --text-primary: #18262d;
  --text-secondary: #51656f;
  --text-title: #102129;
  --text-muted: #73858d;
  --text-option: #203038;
  --accent: #087f6d;
  --accent-strong: #056555;
  --accent-soft: rgba(8,127,109,0.1);
  --reward: #9a6811;
  --success: #197a50;
  --danger: #c53e49;
  --btn-bg: rgba(0,0,0,0.04);
  --btn-text: #6b6a66;
  --btn-active-bg: rgba(8,127,109,0.12);
  --btn-active-text: #102129;
  --btn-hover-bg: rgba(0,0,0,0.06);
  --btn-hover-border: rgba(0,0,0,0.15);
  --modal-bg: rgba(255,255,255,0.98);
  --overlay-bg: rgba(20,35,45,0.34);
  --modal-border: rgba(8,127,109,0.2);
  --option-bg: rgba(0,0,0,0.04);
  --option-text: #2d2a24;
  --progress-bg: rgba(0,0,0,0.08);
  --hint-color: rgba(0,0,0,0.25);
  --header-bg: rgba(0,0,0,0.04);
  --stat-text: #6b6a66;
  --lock-color: #c9d5d8;
  --lock-unlocked-alpha: 0.72;
  --cubie-inner: #dde6e8;
  --cubie-edge: #7d9098;
  --confirm-bg: rgba(255,255,255,0.95);
  --confirm-border: rgba(0,0,0,0.12);
}

/* 主题切换过渡 */
body, .header, .progress-panel, .modal-overlay, .modal-box, .option-btn,
.header-top, .header-stats, .panel-header, .panel-body, .confirm-box, .hint-bar,
.diff-btn, .cloze-passage, .wordbank-passage, .grammar-passage, .cloze-option,
.wordbank-tag, .wordbank-tags, .feedback-area, .modal-passage, .theme-toggle {
  transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

body {
  font-family: "Avenir Next", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(ellipse at 50% 58%, rgba(66,223,192,0.1) 0%, transparent 54%),
              radial-gradient(circle at 80% 12%, rgba(240,197,106,0.055) 0%, transparent 28%),
              linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-x pan-y;
}
#app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

/* ============================================================
   主题切换按钮
   ============================================================ */
.theme-toggle {
  background: var(--header-bg); border: 1px solid var(--border-light);
  border-radius: 50%; width: 34px; height: 34px; font-size: 1rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; line-height: 1; padding: 0;
}
.theme-toggle:hover { background: var(--btn-hover-bg); transform: rotate(15deg); }
.ui-icon, .lucide { width: 16px; height: 16px; stroke-width: 2; pointer-events: none; flex: 0 0 auto; }
.theme-toggle .ui-icon, .theme-toggle .lucide { width: 17px; height: 17px; }
.brand-cube { width: 25px; height: 25px; flex: 0 0 auto; filter: drop-shadow(0 3px 7px rgba(0,0,0,0.3)); }

/* ============================================================
   顶部信息栏
   ============================================================ */
.header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  padding: 12px 16px;
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.header-top {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 6px;
  position: relative;
  pointer-events: auto;
}
.header-top::after {
  content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--reward) 42%, transparent), transparent);
}
.header-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 1.2rem; font-weight: 700; color: var(--text-title);
  letter-spacing: 0; text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 28%, transparent);
  animation: titleBreath 3s ease-in-out infinite;
}
@keyframes titleBreath {
  0%, 100% { text-shadow: 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent); }
  50% { text-shadow: 0 0 32px color-mix(in srgb, var(--accent) 42%, transparent); }
}
.header-stats { font-size: 0.75rem; color: var(--stat-text); background: var(--header-bg); padding: 4px 12px; border-radius: 8px; backdrop-filter: blur(10px); border: 1px solid var(--border-light); }
.header-stats span { color: var(--reward); font-weight: 700; }
.header-diff-badge {
  font-size: 0.7rem; font-weight: 600; color: var(--reward);
  background: color-mix(in srgb, var(--reward) 10%, transparent); padding: 3px 10px; border-radius: 7px;
  border: 1px solid color-mix(in srgb, var(--reward) 22%, transparent);
}
.header-action-btn {
  background: var(--header-bg); border: 1px solid var(--border-light);
  border-radius: 8px; color: var(--text-secondary); font-size: 0.85rem;
  width: 32px; height: 32px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; line-height: 1;
}
.header-action-btn:hover { background: var(--btn-hover-bg); color: var(--text-title); border-color: var(--btn-hover-border); transform: translateY(-1px); }
.header-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.difficulty-selector { display: flex; gap: 4px; margin-top: 0; }
.diff-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 5px 16px; border-radius: 7px; border: 1px solid var(--border-color);
  background: var(--btn-bg); color: var(--btn-text); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.diff-btn:hover {
  border-color: var(--accent); color: var(--text-title);
  transform: translateY(-1px);
}
.diff-btn.active {
  background: var(--accent-soft); border-color: var(--accent); color: var(--btn-active-text);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 22%, transparent);
}

/* 悬浮迷你进度面板 - 顶部 */
.progress-panel {
  position: relative; margin-top: 8px;
  background: var(--bg-panel); backdrop-filter: blur(10px);
  border-radius: 8px; border: 1px solid var(--border-color);
  overflow: hidden; transition: all 0.35s ease;
  pointer-events: auto;
}
.panel-header {
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.panel-header:hover { background: var(--btn-hover-bg); }
.panel-icon { font-size: 1.1rem; }
.panel-icon { display: inline-flex; color: var(--accent); }
#panel-title { display: inline-flex; align-items: center; gap: 8px; }
.panel-reset-all { display: flex; align-items: center; justify-content: center; gap: 6px; }
.panel-reset-btn { display: inline-flex; align-items: center; justify-content: center; }
.panel-reset-btn .lucide { width: 12px; height: 12px; }
.panel-toggle { display: inline-flex; align-items: center; justify-content: center; }
.panel-title { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.panel-progress-text { font-size: 0.8rem; color: var(--text-title); font-weight: 700; white-space: nowrap; }
.panel-progress-bar {
  flex: 1; height: 6px; background: var(--progress-bg); border-radius: 3px;
  overflow: hidden; min-width: 40px;
}
.panel-progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent), var(--reward));
  box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent);
  transition: width 0.4s ease;
}
.panel-percent { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; min-width: 35px; text-align: right; }
.panel-toggle {
  background: none; border: none; color: var(--text-secondary); font-size: 0.75rem;
  cursor: pointer; padding: 4px; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.panel-toggle.open { transform: rotate(90deg); }
.panel-body {
  max-height: 0; overflow: hidden; opacity: 0;
  transform: translateY(-4px);
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.35s ease,
              transform 0.35s ease,
              padding 0.3s ease;
  padding: 0 14px; display: flex; flex-direction: column; gap: 2px;
}
.panel-body.open {
  max-height: 72px; overflow-y: auto; padding: 0 8px 5px;
  opacity: 1; transform: translateY(0);
}
.panel-body-row {
  display: flex; gap: 8px;
}
.panel-body-item {
  flex: 1; display: flex; align-items: center; gap: 4px;
  font-size: 0.65rem; color: var(--text-secondary); cursor: pointer;
  padding: 3px 6px; border-radius: 8px; transition: background 0.2s;
  white-space: nowrap;
  opacity: 0; transform: translateY(-4px);
}
.panel-body.open .panel-body-item {
  opacity: 1; transform: translateY(0);
}
.panel-body.open .panel-body-item:nth-child(1) { transition: all 0.3s ease 0ms; }
.panel-body.open .panel-body-item:nth-child(2) { transition: all 0.3s ease 50ms; }
.panel-body.open .panel-body-item:nth-child(3) { transition: all 0.3s ease 100ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(1) { transition: all 0.3s ease 150ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(2) { transition: all 0.3s ease 200ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(3) { transition: all 0.3s ease 250ms; }
.panel-body-item:hover { background: rgba(255,255,255,0.08); }
.panel-body-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--border-color); }

/* ============================================================
   3D 画布
   ============================================================ */
#cube-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

/* 点击脉冲动画 */
@keyframes cubiePulse {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.08); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}

/* ============================================================
   确认对话框
   ============================================================ */
.confirm-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 200; background: var(--overlay-bg);
  backdrop-filter: blur(8px);
  justify-content: center; align-items: center;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: var(--confirm-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--confirm-border);
  border-radius: 8px; padding: 24px;
  width: 90%; max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.25s ease-out;
}
.confirm-title { font-size: 1rem; font-weight: 700; color: var(--text-title); margin-bottom: 8px; }
.confirm-message { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
.confirm-buttons { display: flex; gap: 10px; justify-content: center; }
.confirm-btn {
  padding: 8px 24px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.confirm-btn-cancel { background: var(--btn-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
.confirm-btn-cancel:hover { background: var(--btn-hover-bg); }
.confirm-btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
.confirm-btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
.confirm-btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
.confirm-btn-warning:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(243,156,18,0.3); }

/* 面板内重置按钮 */
.panel-reset-btn {
  background: none; border: none; color: #555; font-size: 0.7rem;
  cursor: pointer; padding: 2px 4px; border-radius: 4px;
  transition: all 0.2s; margin-left: 2px; opacity: 0.5;
}
.panel-reset-btn:hover { color: #e74c3c; opacity: 1; background: rgba(231,76,60,0.1); }
.panel-reset-all {
  display: block; width: 100%; margin-top: 8px; padding: 6px 0;
  background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.2);
  border-radius: 8px; color: #e74c3c; font-size: 0.75rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; text-align: center;
}
.panel-reset-all:hover { background: rgba(231,76,60,0.15); border-color: rgba(231,76,60,0.4); }

/* ============================================================
   底部提示
   ============================================================ */
.hint-bar {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  font-size: 0.7rem; color: var(--hint-color);
  pointer-events: none; z-index: 10;
  text-align: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: opacity 0.5s ease;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}

/* ============================================================
   3D 画布
   ============================================================ */
#cube-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

/* ============================================================
   答题弹窗
   ============================================================ */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 100; background: var(--overlay-bg);
  backdrop-filter: blur(8px);
  justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 20px 0;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--modal-bg);
  color: var(--text-primary);
  backdrop-filter: blur(24px);
  border: 1px solid var(--modal-border);
  border-radius: 8px; padding: 16px;
  width: 96%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  margin: auto;
  box-shadow: 0 0 40px rgba(74,230,201,0.06), 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1), borderGlow 0.9s ease-out 1;
}
@media (min-width: 480px) {
  .modal-box { width: 90%; padding: 24px; }
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes borderGlow {
  0%, 100% { border-color: var(--modal-border); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 5%, transparent); }
  50% { border-color: color-mix(in srgb, var(--accent) 38%, transparent); box-shadow: 0 0 38px color-mix(in srgb, var(--accent) 14%, transparent); }
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.modal-face-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; color: #fff;
  box-shadow: 0 0 20px rgba(74,230,201,0.25);
}
.modal-level { font-size: 0.75rem; color: var(--text-secondary); }

.modal-title {
  font-size: 1.1rem; font-weight: 700; color: var(--text-title); margin-bottom: 12px;
}

/* 题目类型：短文 */
.modal-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 12px 14px; font-size: 0.85rem; line-height: 1.7;
  color: var(--text-secondary); margin-bottom: 14px;
  border-left: 3px solid rgba(74,230,201,0.55);
}

[data-theme="light"] #panel-content [style*="background:rgba(255,255,255,0.04)"] {
  background: var(--bg-item) !important;
}
[data-theme="light"] #panel-content [style*="border:1px solid rgba(255,255,255,0.06)"] {
  border-color: var(--border-color) !important;
}
[data-theme="light"] #panel-content [style*="color:#fff"],
[data-theme="light"] #cert-overlay [style*="color:#fff"] { color: var(--text-title) !important; }
[data-theme="light"] #panel-content [style*="color:#ccc"],
[data-theme="light"] #panel-content [style*="color:#aaa"],
[data-theme="light"] #panel-content [style*="color:#888"],
[data-theme="light"] #cert-overlay [style*="color:#ccc"],
[data-theme="light"] #cert-overlay [style*="color:#aaa"] { color: var(--text-secondary) !important; }

/* 选项 */
.modal-question { font-size: 0.95rem; color: var(--text-primary); margin-bottom: 14px; line-height: 1.6; }
.options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 8px;
  background: var(--option-bg); border: 1px solid var(--border-color);
  color: var(--option-text); font-size: 1rem; cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); text-align: left; min-height: 44px;
}
.option-btn:hover {
  background: var(--btn-hover-bg); border-color: var(--btn-hover-border);
  transform: translateY(-2px); box-shadow: 0 4px 15px rgba(74,230,201,0.1);
}
.option-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.option-btn.correct { border-color: var(--success); background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); animation: correctPop 0.4s ease; }
.option-btn.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); animation: wrongShake 0.4s ease; }
.option-btn:disabled { pointer-events: none; }
.option-letter { font-weight: 700; font-size: 1rem; opacity: 0.6; min-width: 24px; }

/* 题型标签 */
.question-type-badge {
  display: inline-block; font-size: 0.65rem; font-weight: 600;
  padding: 2px 8px; border-radius: 8px; margin-left: 8px;
  vertical-align: middle;
}
.type-choice { background: var(--accent-soft); color: var(--accent); }
.type-cloze { background: rgba(86,156,214,0.14); color: #68aee5; }
.type-wordbank { background: color-mix(in srgb, var(--reward) 14%, transparent); color: var(--reward); }
.type-grammar { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }

/* 完形填空 - 短文中的空格 */
.cloze-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 14px; font-size: 0.85rem; line-height: 2.2;
  color: var(--text-secondary); margin-bottom: 14px;
}
.cloze-blank {
  display: inline-block; min-width: 80px; text-align: center;
  border-bottom: 2px dashed rgba(74,230,201,0.5);
  padding: 0 6px; margin: 0 2px; color: #4ae6c9; font-weight: 600;
  cursor: default; transition: all 0.2s;
}
.cloze-blank.filled { border-bottom-color: #4ae6c9; }
.cloze-blank.current { background: rgba(74,230,201,0.1); border-bottom-color: #4ae6c9; }
.cloze-blank.correct-blank { border-bottom-color: #27ae60; color: #27ae60; }
.cloze-blank.wrong-blank { border-bottom-color: #e74c3c; color: #e74c3c; }
.cloze-options-group { margin-bottom: 10px; }
.cloze-options-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
.cloze-options-row { display: flex; gap: 6px; flex-wrap: wrap; }
.cloze-option {
  padding: 6px 14px; border-radius: 8px; font-size: 0.85rem;
  background: var(--option-bg); border: 1px solid var(--border-color);
  color: var(--option-text); cursor: pointer; transition: all 0.15s;
}
.cloze-option:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
.cloze-option.selected-opt { border-color: #4ae6c9; background: rgba(74,230,201,0.15); color: #4ae6c9; }
.cloze-option.correct-opt { border-color: #27ae60; background: rgba(39,174,96,0.2); color: #27ae60; }
.cloze-option.wrong-opt { border-color: #e74c3c; background: rgba(231,76,60,0.2); color: #e74c3c; }

/* 选词填空 */
.wordbank-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 14px; font-size: 0.85rem; line-height: 2.2;
  color: var(--text-secondary); margin-bottom: 14px;
}
.wordbank-blank {
  display: inline-block; min-width: 80px; text-align: center;
  border-bottom: 2px dashed rgba(253,203,110,0.5);
  padding: 0 6px; margin: 0 2px; color: #fdcb6e; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border-radius: 2px;
}
.wordbank-blank.filled { border-bottom-style: solid; }
.wordbank-blank.current { background: rgba(253,203,110,0.1); }
.wordbank-blank.correct-blank { border-bottom-color: #27ae60; color: #27ae60; }
.wordbank-blank.wrong-blank { border-bottom-color: #e74c3c; color: #e74c3c; }
.wordbank-tags {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  padding: 10px; background: var(--bg-passage); border-radius: 10px;
  border: 1px solid var(--border-light);
}
.wordbank-tag {
  padding: 6px 14px; border-radius: 8px; font-size: 0.85rem;
  background: rgba(253,203,110,0.1); border: 1px solid rgba(253,203,110,0.25);
  color: #fdcb6e; cursor: pointer; transition: all 0.15s;
}
.wordbank-tag:hover { background: rgba(253,203,110,0.2); border-color: rgba(253,203,110,0.4); }
.wordbank-tag.used { opacity: 0.3; pointer-events: none; text-decoration: line-through; }

/* 语法填空 */
.grammar-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 14px; font-size: 0.85rem; line-height: 2.2;
  color: var(--text-secondary); margin-bottom: 14px;
}
.grammar-input {
  display: inline-block; width: 120px; padding: 4px 8px;
  background: var(--option-bg); border: 1px solid rgba(255,107,107,0.3);
  border-radius: 6px; color: var(--text-title); font-size: 0.85rem; text-align: center;
  margin: 0 4px; outline: none; transition: all 0.2s;
}
.grammar-input:focus { border-color: #ff6b6b; box-shadow: 0 0 8px rgba(255,107,107,0.2); }
.grammar-input.correct-input { border-color: #27ae60; background: rgba(39,174,96,0.1); }
.grammar-input.wrong-input { border-color: #e74c3c; background: rgba(231,76,60,0.1); }
.grammar-hint { font-size: 0.7rem; color: var(--text-muted); margin-left: 2px; }

/* 反馈 */
.feedback-area { display: none; margin-bottom: 16px; }
.feedback-area.show { display: block; }
.feedback-correct { color: var(--success); font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; animation: correctPop 0.5s ease; }
.feedback-wrong { color: var(--danger); font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; animation: wrongShake 0.5s ease; }
.feedback-correct, .feedback-wrong, .countdown-hint { display: flex; align-items: center; justify-content: center; gap: 6px; }
.feedback-explanation {
  background: var(--bg-passage); border-radius: 8px;
  padding: 10px 14px; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5;
}
.countdown-hint {
  text-align: center; font-size: 0.78rem; color: var(--accent);
  margin-top: 8px; animation: fadeIn 0.3s ease;
}

@keyframes correctPop {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
  border: none; cursor: pointer;
  transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  width: 100%;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #071712; box-shadow: 0 4px 15px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn:disabled { cursor: not-allowed; opacity: 0.42; filter: saturate(0.35); box-shadow: none; transform: none; }
.btn:focus-visible, .option-btn:focus-visible, .diff-btn:focus-visible,
.header-action-btn:focus-visible, .theme-toggle:focus-visible {
  outline: 2px solid var(--reward); outline-offset: 2px;
}
.btn-secondary { background: var(--btn-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--btn-hover-bg); }
.btn-close {
  background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer;
  padding: 4px 8px; line-height: 1;
}
.btn-close:hover { color: var(--text-title); }

/* 锁定提示 */
.locked-tip {
  text-align: center; color: var(--text-muted); padding: 20px 0;
  font-size: 0.9rem; line-height: 1.6;
}
#locked-tip-msg .lucide { width: 24px; height: 24px; margin-bottom: 6px; color: var(--text-secondary); }
.locked-tip-btn {
  margin-top: 16px;
  padding: 8px 24px;
  background: rgba(74, 230, 201, 0.15);
  border: 1px solid rgba(74, 230, 201, 0.3);
  border-radius: 8px;
  color: #4ae6c9;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s;
}
.locked-tip-btn:hover { background: rgba(74, 230, 201, 0.25); }

/* 锁定魔方格悬停提示 */
.lock-hover-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text-secondary);
  font-size: 0.75rem;
  z-index: 1000;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}
.lock-hover-tooltip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================

@media (max-width: 480px) {

}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

console.log('🧩 魔方英语 | Three.js v' + THREE.REVISION);

function refreshIcons() {
  if (window.lucide) window.lucide.createIcons({ attrs: { 'aria-hidden': 'true' } });
}

function iconMarkup(name) {
  return `<i data-lucide="${name}"></i>`;
}

function setIconButton(button, iconName, label) {
  button.innerHTML = iconMarkup(iconName);
  button.title = label;
  button.setAttribute('aria-label', label);
  refreshIcons();
}

function setPanelTitle(iconName, text) {
  document.getElementById('panel-title').innerHTML = `${iconMarkup(iconName)}<span>${text}</span>`;
  refreshIcons();
}

// ============================================================
// 面 ID 到题库 ID 的映射
const FACE_TO_QB = { front: 'grammar', back: 'vocabulary', left: 'reading', right: 'cloze', top: 'speaking', bottom: 'fun' };
const QB_TO_FACE = { grammar: 'front', vocabulary: 'back', reading: 'left', cloze: 'right', speaking: 'top', fun: 'bottom' };

// 面定义
// ============================================================
const FACES = {
  front:  { id: 'front',  name: '语法核心', color: '#E34850', axis: 'z', value: 1,  normal: [0,0,1] },
  back:   { id: 'back',   name: '词汇辨析', color: '#F08A35', axis: 'z', value: -1, normal: [0,0,-1] },
  left:   { id: 'left',   name: '阅读理解', color: '#2DB67D', axis: 'x', value: -1, normal: [-1,0,0] },
  right:  { id: 'right',  name: '完形填空', color: '#3478D4', axis: 'x', value: 1,  normal: [1,0,0] },
  top:    { id: 'top',    name: '口语表达', color: '#F4F1E8', axis: 'y', value: 1,  normal: [0,1,0] },
  bottom: { id: 'bottom', name: '趣味英语', color: '#F0C84B', axis: 'y', value: -1, normal: [0,-1,0] },
};

// 面到行列映射：给定 cubie 位置 (x,y,z) 和被点击面的法线，返回 {row, col}
function getFaceCell(x, y, z, nx, ny, nz) {
  if (nz === 1)    return { row: 1 - y, col: x + 1 };       // front
  if (nz === -1)   return { row: 1 - y, col: 1 - x };       // back
  if (nx === -1)   return { row: 1 - y, col: 1 - z };       // left
  if (nx === 1)    return { row: 1 - y, col: z + 1 };       // right
  if (ny === 1)    return { row: 1 - z, col: x + 1 };       // top
  if (ny === -1)   return { row: z + 1, col: x + 1 };       // bottom
  return null;
}

// 根据法线获取面 ID
function getFaceFromNormal(nx, ny, nz) {
  if (nz === 1)  return 'front';
  if (nz === -1) return 'back';
  if (nx === -1) return 'left';
  if (nx === 1)  return 'right';
  if (ny === 1)  return 'top';
  if (ny === -1) return 'bottom';
  return null;
}

      { id: 'm24', title: '短文：科技', passage: 'Smartphones have changed our lives in many ways. We can now communicate with anyone, anywhere, at any time. However, spending too much time on phones can be harmful to our eyes and social skills.', question: 'What is one disadvantage of smartphones mentioned in the passage?', options: ['They are expensive', 'They are slow', 'They can harm our eyes', 'They are hard to use'], correctIndex: 2, explanation: '文中提到 "spending too much time on phones can be harmful to our eyes"。' },
      { id: 'm25', title: '短文：历史', passage: 'The Silk Road was not a single road but a network of trade routes connecting China with the West. It began during the Han Dynasty and lasted for over 1,500 years. Silk, tea, and spices were transported from East to West, while gold, glass, and new ideas traveled from West to East.', question: 'When did the Silk Road begin?', options: ['The Tang Dynasty', 'The Song Dynasty', 'The Han Dynasty', 'The Ming Dynasty'], correctIndex: 2, explanation: '文中明确提到 "It began during the Han Dynasty"。' },
      { id: 'm26', title: '短文：心理', passage: 'A growth mindset is the belief that abilities can be developed through hard work and dedication. People with a growth mindset see challenges as opportunities to learn. In contrast, a fixed mindset assumes that intelligence is static and cannot be changed.', question: 'What do people with a growth mindset think about challenges?', options: ['They avoid them', 'They see them as opportunities', 'They ignore them', 'They fear them'], correctIndex: 1, explanation: '文中说 "People with a growth mindset see challenges as opportunities to learn"。' },
      { id: 'm27', title: '短文：科学', passage: 'Photosynthesis is the process by which plants convert sunlight into energy. During this process, plants take in carbon dioxide and water, and release oxygen as a byproduct. This process is essential for life on Earth as it provides the oxygen we breathe.', question: 'What do plants release during photosynthesis?', options: ['Carbon dioxide', 'Nitrogen', 'Oxygen', 'Hydrogen'], correctIndex: 2, explanation: '文中说 "release oxygen as a byproduct"。' },
    ],
    cloze: [
      { id: 'm28', title: '完形: 日常', passage: 'Mike gets up at 7:00 every morning. He ___ (1) his teeth and then has breakfast. He usually ___ (2) to school by bike.', question: '选择空格1的正确答案', options: ['brush', 'brushes', 'brushing', 'brushed'], correctIndex: 1, explanation: '主语 He 是第三人称单数，一般现在时动词加 -es。' },
      { id: 'm29', title: '完形: 天气', passage: 'It was a ___ (1) day. The sun was shining and the birds were singing. Amy ___ (2) to the park with her dog.', question: '选择空格1的正确答案', options: ['sunny', 'rain', 'cloud', 'wind'], correctIndex: 0, explanation: '根据后文 "The sun was shining" 可知是晴天，形容词 sunny 修饰 day。' },
      { id: 'm30', title: '完形: 购物', passage: 'Mom went to the supermarket. She bought some ___ (1) and vegetables. She also got a ___ (2) of milk for breakfast.', question: '选择空格2的正确答案', options: ['bottle', 'piece', 'loaf', 'pair'], correctIndex: 0, explanation: 'a bottle of milk 是固定搭配，表示一瓶牛奶。' },
      { id: 'm31', title: '完形: 旅行', passage: 'Last summer, my family ___ (1) to Beijing. We visited the Great Wall and the Forbidden City. The trip was ___ (2) and we all had a great time.', question: '选择空格1的正确答案', options: ['go', 'goes', 'went', 'will go'], correctIndex: 2, explanation: 'Last summer 是过去时间，须用一般过去时 went。' },
      { id: 'm32', title: '完形: 友谊', passage: 'A true friend is someone who always ___ (1) by your side. When you are sad, they ___ (2) you up. When you succeed, they are happy for you.', question: '选择空格2的正确答案', options: ['cheer', 'cheers', 'cheering', 'cheered'], correctIndex: 0, explanation: '助动词 do 后用动词原形，they cheer you up。cheer up 是固定搭配，表示「使振作」。' },
      { id: 'm33', title: '完形: 健康', passage: 'Getting enough sleep is very important for teenagers. Research shows that teenagers ___ (1) at least 8 hours of sleep each night. Lack of sleep can ___ (2) to poor concentration.', question: '选择空格2的正确答案', options: ['lead', 'leads', 'leading', 'led'], correctIndex: 0, explanation: 'can 后接动词原形，lead to 表示「导致」。' },
      { id: 'm34', title: '完形: 文化', passage: 'Different cultures have different customs. In Japan, people bow when they greet each other. In Western countries, people usually ___ (1) hands. Understanding these differences can help avoid ___ (2).', question: '选择空格2的正确答案', options: ['misunderstand', 'misunderstanding', 'misunderstood', 'misunderstands'], correctIndex: 1, explanation: 'avoid 后接动名词，avoid misunderstanding 表示「避免误解」。' },
      { id: 'm35', title: '完形: 环境', passage: 'Global warming is one of the biggest challenges facing humanity. If we ___ (1) act now, the consequences will be severe. Many countries have already started ___ (2) measures to reduce carbon emissions.', question: '选择空格1的正确答案', options: ['don\'t', 'didn\'t', 'won\'t', 'haven\'t'], correctIndex: 0, explanation: 'if 条件句中用一般现在时表将来，don\'t act 表示「如果不采取行动」。' },
      { id: 'm36', title: '完形: 综合', passage: 'The invention of the Internet has fundamentally ___ (1) the way we live and work. It has made information ___ (2) to billions of people worldwide.', question: '选择空格1的正确答案', options: ['change', 'changed', 'changing', 'changes'], correctIndex: 1, explanation: 'has + 过去分词构成现在完成时，change 的过去分词是 changed。' },
    ],
    speaking: [
      { id: 'm37', title: '打招呼', question: 'How do you respond when someone says "Nice to meet you"?', options: ['Goodbye', 'Nice to meet you, too', 'I\'m sorry', 'Thank you'], correctIndex: 1, explanation: '当别人说 "Nice to meet you"（很高兴认识你），你应回答 "Nice to meet you, too"（我也很高兴认识你）。' },
      { id: 'm38', title: '问路', question: 'Excuse me, ___ is the nearest hospital?', options: ['what', 'where', 'when', 'why'], correctIndex: 1, explanation: '问地点用 where，where is the nearest hospital? = 最近的医院在哪里？' },
      { id: 'm39', title: '点餐', question: 'In a restaurant, the waiter asks: "What would you like to ___?"', options: ['eat', 'drink', 'order', 'cook'], correctIndex: 2, explanation: '在餐厅点餐时，服务员通常问 "What would you like to order?"（您想点什么？）。' },
      { id: 'm40', title: '电话用语', question: 'When you answer the phone, you should say:', options: ['Who are you?', 'What do you want?', 'Hello, this is [name] speaking.', 'Speak!'], correctIndex: 2, explanation: '接电话时礼貌的说法是 "Hello, this is [name] speaking."，表示「你好，我是…」。' },
      { id: 'm41', title: '道歉', question: 'If you accidentally step on someone\'s foot, you should say:', options: ['Excuse me', 'I\'m sorry', 'Thank you', 'Never mind'], correctIndex: 1, explanation: '踩到别人脚是不小心造成的伤害，应该说 "I\'m sorry"（对不起）。Excuse me 用于打扰别人时。' },
      { id: 'm42', title: '请假', question: 'You are sick and want to ask for a day off. You say:', options: ['I quit!', 'May I have a day off?', 'I don\'t care', 'Leave me alone'], correctIndex: 1, explanation: '请假应该礼貌地问 "May I have a day off?"（我可以请一天假吗？）。' },
      { id: 'm43', title: '商务对话', question: 'In a job interview, the interviewer asks: "What are your strengths?" You should respond:', options: ['I don\'t have any', 'I\'m good at teamwork and problem-solving', 'That\'s personal', 'I don\'t know'], correctIndex: 1, explanation: '面试中问优点，应该自信地展示自己的技能，如团队合作和解决问题的能力。' },
      { id: 'm44', title: '投诉', question: 'You received a damaged product. You call customer service and say:', options: ['You are terrible!', 'I\'d like to make a complaint about a damaged item.', 'Give me my money!', 'Whatever'], correctIndex: 1, explanation: '投诉时应该礼貌地说明问题，用 "I\'d like to make a complaint about..." 是得体的表达方式。' },
      { id: 'm45', title: '演讲开场', question: 'What is a good way to start a presentation?', options: ['Good morning, everyone. Today I\'d like to talk about...', 'Hey guys, let\'s just get this over with.', 'I didn\'t prepare anything.', 'Can someone else do this?'], correctIndex: 0, explanation: '演讲开场应该礼貌问候听众并说明演讲主题，用 "Good morning, everyone. Today I\'d like to talk about..." 是标准开场。' },
    ],
    fun: [
      { id: 'm46', title: '谜语：字母', question: 'What letter is a drink?', options: ['T (tea)', 'C (coffee)', 'W (water)', 'M (milk)'], correctIndex: 0, explanation: '字母 T 的发音与 tea（茶）相同，所以说 "T" is a drink！' },
      { id: 'm47', title: '常识：颜色', question: 'What color is the British phone booth?', options: ['Blue', 'Green', 'Red', 'Yellow'], correctIndex: 2, explanation: '英国的红色电话亭（Red Phone Booth）是英国的标志性文化符号。' },
      { id: 'm48', title: '谜语：月份', question: 'Which month has 28 days?', options: ['February', 'January', 'All of them', 'None'], correctIndex: 2, explanation: '所有月份都有28天（甚至更多），这是一个常见的英语脑筋急转弯！' },
      { id: 'm49', title: '常识：节日', question: 'What holiday is celebrated on December 25th?', options: ['Halloween', 'Thanksgiving', 'Christmas', 'Easter'], correctIndex: 2, explanation: '12月25日是圣诞节（Christmas Day），是西方最重要的节日之一。' },
      { id: 'm50', title: '谜语：蛋', question: 'What has to be broken before you can use it?', options: ['A window', 'An egg', 'A door', 'A book'], correctIndex: 1, explanation: '鸡蛋（egg）在使用前必须先打破（break），这是一个经典的英语谜语。' },
      { id: 'm51', title: '常识：地标', question: 'In which city can you find the Statue of Liberty?', options: ['Los Angeles', 'Chicago', 'New York', 'Boston'], correctIndex: 2, explanation: '自由女神像（Statue of Liberty）位于美国纽约（New York）。' },
      { id: 'm52', title: '文化：文学', question: 'Who wrote "Romeo and Juliet"?', options: ['Charles Dickens', 'William Shakespeare', 'Jane Austen', 'Mark Twain'], correctIndex: 1, explanation: '《罗密欧与朱丽叶》是英国剧作家威廉·莎士比亚（William Shakespeare）的经典作品。' },
      { id: 'm53', title: '文化：名言', question: '"To be, or not to be" is from which play?', options: ['Macbeth', 'Hamlet', 'King Lear', 'Othello'], correctIndex: 1, explanation: '"To be, or not to be"（生存还是毁灭）是莎士比亚的《哈姆雷特》（Hamlet）中的经典独白。' },
      { id: 'm54', title: '文化：食物', question: 'What is the traditional British meal "fish and chips" served with?', options: ['Rice', 'Fries (chips)', 'Pasta', 'Bread'], correctIndex: 1, explanation: 'Fish and Chips（炸鱼薯条）是英国传统美食，鱼和薯条（chips=炸薯条）一起搭配食用。' },
    ],
  },

  // ─── 高中难度 (hard) ──────────────────────────────
  hard: {
    grammar: [
      { id: 'h1', title: '虚拟语气', question: 'If I ___ you, I would accept the offer.', options: ['am', 'was', 'were', 'be'], correctIndex: 2, explanation: '与现在事实相反的虚拟语气，if 从句中 be 动词一律用 were，不论主语人称。' },
      { id: 'h2', title: '过去完成时', question: 'By the time the police arrived, the thief ___ (escape).', options: ['escaped', 'had escaped', 'has escaped', 'was escaping'], correctIndex: 1, explanation: 'by the time + 过去时间点，主句表示「过去的过去」，须用过去完成时 had + 过去分词。' },
      { id: 'h3', title: '非谓语动词', question: '___ (see) from the top of the mountain, the city looks beautiful.', options: ['Seeing', 'Seen', 'To see', 'Having seen'], correctIndex: 1, explanation: 'the city 与 see 是被动关系（城市被看），用过去分词 Seen 作状语。' },
      { id: 'h4', title: '定语从句', question: 'This is the house ___ I was born.', options: ['which', 'that', 'where', 'when'], correctIndex: 2, explanation: '定语从句中缺少地点状语（in the house），用关系副词 where。' },
      { id: 'h5', title: '倒装句', question: 'Not until the teacher came in ___ the noise.', options: ['the students stopped', 'did the students stop', 'the students did stop', 'stopped the students'], correctIndex: 1, explanation: 'Not until 置于句首时，主句须部分倒装，助动词 did 提前。' },
      { id: 'h6', title: '名词性从句', question: '___ surprises me most is that he passed the exam without studying.', options: ['That', 'What', 'Which', 'It'], correctIndex: 1, explanation: 'What 引导主语从句，在从句中作主语，表示「…的事情」。' },
      { id: 'h7', title: '时态综合', question: 'He ___ (work) in this company since he graduated from college.', options: ['worked', 'has been working', 'works', 'is working'], correctIndex: 1, explanation: 'since + 过去时间点，表示从过去持续到现在的动作，用现在完成进行时。' },
      { id: 'h8', title: '情态动词+完成时', question: 'You ___ (tell) me earlier. I could have helped you.', options: ['should tell', 'should have told', 'must tell', 'need tell'], correctIndex: 1, explanation: 'should have + 过去分词表示「本应该做而没做」，表达对过去的遗憾。' },
      { id: 'h9', title: '强调句', question: 'It was in the library ___ I met her for the first time.', options: ['where', 'that', 'which', 'when'], correctIndex: 1, explanation: '强调句型 It is/was... that...，强调地点状语时仍用 that。' },
    ],
    vocabulary: [
      { id: 'h10', title: '高级词汇', question: 'The government has ___ new measures to control pollution.', options: ['implemented', 'made', 'did', 'put'], correctIndex: 0, explanation: 'implement measures 表示「实施措施」，是正式书面用语，比 make/put 更正式。' },
      { id: 'h11', title: '词义辨析', question: 'The witness\'s testimony was ___ with the evidence found at the scene.', options: ['consistent', 'constant', 'continuous', 'convenient'], correctIndex: 0, explanation: 'consistent with 表示「与…一致」，constant 表示「持续的」，continuous 表示「连续的」。' },
      { id: 'h12', title: '短语动词', question: 'The meeting has been ___ until next Monday due to the manager\'s illness.', options: ['put off', 'put away', 'put through', 'put down'], correctIndex: 0, explanation: 'put off 表示「推迟」，put away 表示「收起来」，put through 表示「接通电话」，put down 表示「放下/镇压」。' },
      { id: 'h13', title: '形近词', question: 'The scientist made a significant ___ to the field of genetics.', options: ['contribution', 'distribution', 'attribution', 'retribution'], correctIndex: 0, explanation: 'contribution to 表示「对…的贡献」，distribution 表示「分配」，attribution 表示「归因」，retribution 表示「惩罚」。' },
      { id: 'h14', title: '熟词僻义', question: 'The company plans to ___ a new product line next quarter.', options: ['launch', 'throw', 'drop', 'push'], correctIndex: 0, explanation: 'launch 除「发射」外还表示「推出（新产品）」，launch a product = 推出产品。' },
      { id: 'h15', title: '搭配辨析', question: 'The new policy will come into ___ on January 1st.', options: ['effect', 'affect', 'effort', 'affair'], correctIndex: 0, explanation: 'come into effect 是固定搭配，表示「生效」。affect 是动词，effort 表示「努力」，affair 表示「事务」。' },
      { id: 'h16', title: '学术词汇', question: 'The two theories are not mutually ___ ; they can coexist.', options: ['exclusive', 'inclusive', 'excessive', 'aggressive'], correctIndex: 0, explanation: 'mutually exclusive 表示「互斥的」，inclusive 表示「包容的」，excessive 表示「过度的」。' },
      { id: 'h17', title: '动词短语', question: 'After years of hard work, her dream finally ___ .', options: ['came true', 'realized', 'achieved', 'completed'], correctIndex: 0, explanation: 'come true 表示梦想「实现」，是不及物用法；realize 是及物动词，需用被动语态 was realized。' },
      { id: 'h18', title: '综合辨析', question: 'The professor ___ that the experiment be repeated under controlled conditions.', options: ['insisted', 'persisted', 'consisted', 'assisted'], correctIndex: 0, explanation: 'insist that... (should) do 表示「坚持要求…」，从句用虚拟语气。persist in doing 表示「坚持做」。' },
    ],
    reading: [
      { id: 'h19', title: '短文：人工智能', passage: 'Artificial intelligence has made remarkable progress in recent years. From self-driving cars to medical diagnosis, AI systems are increasingly capable of performing tasks that once required human intelligence. However, concerns about job displacement and ethical implications have sparked heated debates among policymakers and the public alike.', question: 'What is one concern about AI mentioned in the passage?', options: ['It is too slow', 'Job displacement', 'It is too expensive', 'It cannot learn'], correctIndex: 1, explanation: '文中提到 "concerns about job displacement and ethical implications"。' },
      { id: 'h20', title: '短文：气候变化', passage: 'Climate change is arguably the most pressing challenge of our time. Rising global temperatures have led to more frequent extreme weather events, melting ice caps, and rising sea levels. Scientists warn that without immediate and substantial reductions in greenhouse gas emissions, the consequences could be catastrophic for future generations.', question: 'What have rising temperatures NOT caused according to the passage?', options: ['Extreme weather', 'Melting ice caps', 'Rising sea levels', 'More forests'], correctIndex: 3, explanation: '文中列举了 extreme weather events, melting ice caps, rising sea levels，没有提到 more forests。' },
      { id: 'h21', title: '短文：经济学', passage: 'The concept of supply and demand is fundamental to economics. When demand for a product exceeds its supply, prices tend to rise. Conversely, when supply exceeds demand, prices typically fall. This dynamic relationship serves as the invisible hand that guides market economies, as described by Adam Smith in his seminal work "The Wealth of Nations."', question: 'Who described the market mechanism as an "invisible hand"?', options: ['Karl Marx', 'John Keynes', 'Adam Smith', 'David Ricardo'], correctIndex: 2, explanation: '文中提到 "as described by Adam Smith in his seminal work \'The Wealth of Nations\'."' },
      { id: 'h22', title: '短文：心理学', passage: 'Cognitive dissonance refers to the mental discomfort experienced when a person holds two or more contradictory beliefs, values, or attitudes simultaneously. To reduce this discomfort, individuals tend to either change their beliefs, acquire new information that supports their existing views, or minimize the importance of the conflicting cognition.', question: 'What is cognitive dissonance?', options: ['A type of memory loss', 'Mental discomfort from contradictory beliefs', 'A learning disorder', 'A form of intelligence'], correctIndex: 1, explanation: '文中定义为 "mental discomfort experienced when a person holds two or more contradictory beliefs"。' },
      { id: 'h23', title: '短文：文学', passage: 'The Romantic movement, which flourished in Europe from the late 18th to mid-19th century, emphasized emotion, individualism, and the glorification of nature. Romantic poets such as Wordsworth and Keats rejected the rigid rationality of the Enlightenment, instead celebrating the sublime beauty of the natural world and the depth of human emotion.', question: 'What did Romantic poets reject?', options: ['Nature', 'Emotion', 'Enlightenment rationality', 'Poetry itself'], correctIndex: 2, explanation: '文中说 "rejected the rigid rationality of the Enlightenment"。' },
      { id: 'h24', title: '短文：生物学', passage: 'CRISPR-Cas9 is a revolutionary gene-editing technology that allows scientists to modify DNA sequences with unprecedented precision. Derived from a natural defense mechanism found in bacteria, CRISPR has opened up new possibilities for treating genetic disorders, improving crop resilience, and even potentially eradicating certain diseases.', question: 'Where does CRISPR technology originally come from?', options: ['Plants', 'Animals', 'Bacteria', 'Viruses'], correctIndex: 2, explanation: '文中说 "Derived from a natural defense mechanism found in bacteria"。' },
      { id: 'h25', title: '短文：哲学', passage: 'Existentialism posits that existence precedes essence—meaning that humans are not born with a predetermined purpose but must create their own meaning through choices and actions. Philosophers like Jean-Paul Sartre argued that this freedom comes with profound responsibility, as each individual\'s choices define not only themselves but also their vision of humanity.', question: 'According to existentialism, what precedes essence?', options: ['Freedom', 'Existence', 'Responsibility', 'Choice'], correctIndex: 1, explanation: '文中第一句说 "existence precedes essence"。' },
      { id: 'h26', title: '短文：历史', passage: 'The Renaissance, meaning "rebirth," was a cultural movement that spanned roughly from the 14th to the 17th century. Beginning in Italy and spreading across Europe, it marked the transition from the medieval period to modernity. The movement was characterized by a revival of classical learning, groundbreaking developments in art and science, and the rise of humanism.', question: 'Where did the Renaissance begin?', options: ['France', 'England', 'Italy', 'Germany'], correctIndex: 2, explanation: '文中说 "Beginning in Italy and spreading across Europe"。' },
      { id: 'h27', title: '短文：社会学', passage: 'Social stratification refers to the hierarchical arrangement of individuals in a society based on factors such as wealth, power, and prestige. Sociologists distinguish between open systems, where social mobility is possible through merit and achievement, and closed systems, where social position is largely determined by birth. Most modern societies are theoretically open but exhibit varying degrees of actual mobility.', question: 'What determines social position in a closed system?', options: ['Merit', 'Achievement', 'Birth', 'Education'], correctIndex: 2, explanation: '文中说 "closed systems, where social position is largely determined by birth"。' },
    ],
    cloze: [
      { id: 'h28', title: '完形: 学术', passage: 'The scientific method is a systematic approach to inquiry that ___ (1) observation, hypothesis formation, experimentation, and conclusion. Scientists must remain objective and avoid letting personal biases ___ (2) their results.', question: '选择空格1的正确答案', options: ['involves', 'involve', 'involving', 'involved'], correctIndex: 0, explanation: '主语 the scientific method 是单数，一般现在时第三人称单数用 involves。' },
      { id: 'h29', title: '完形: 经济', passage: 'Inflation occurs when the general price level of goods and services rises, ___ (1) the purchasing power of money. Central banks typically respond by ___ (2) interest rates to curb excessive inflation.', question: '选择空格2的正确答案', options: ['raise', 'raising', 'raised', 'raises'], correctIndex: 1, explanation: 'by 是介词，后接动名词 raising。by raising interest rates = 通过提高利率。' },
      { id: 'h30', title: '完形: 文学', passage: 'Metaphor is a figure of speech that makes an implicit comparison between two ___ (1) things. Unlike similes, which use "like" or "as," metaphors directly state that one thing ___ (2) another.', question: '选择空格1的正确答案', options: ['similar', 'unrelated', 'identical', 'familiar'], correctIndex: 1, explanation: '隐喻是在两个无关（unrelated）事物之间进行隐含比较，similar 是明喻的特征。' },
      { id: 'h31', title: '完形: 心理', passage: 'The placebo effect demonstrates the powerful influence of the mind on the body. Patients who believe they are receiving treatment often show improvement, even when the treatment has no ___ (1) value. This phenomenon highlights the importance of psychological factors in ___ (2) outcomes.', question: '选择空格1的正确答案', options: ['therapeutic', 'theoretical', 'technical', 'terminal'], correctIndex: 0, explanation: 'therapeutic value 表示「治疗价值」，即使没有治疗价值的安慰剂也能产生效果。' },
      { id: 'h32', title: '完形: 环境', passage: 'Biodiversity refers to the variety of life on Earth at all levels. The ___ (1) rate of species extinction, largely caused by human activities such as deforestation and pollution, has raised alarm among scientists. Conservation efforts are ___ (2) to preserving ecosystems for future generations.', question: '选择空格2的正确答案', options: ['crucial', 'crucially', 'cruciality', 'crucify'], correctIndex: 0, explanation: 'be crucial to 表示「对…至关重要」，crucial 是形容词。' },

const CUBIE_SIZE = 0.95;
const CUBIE_GAP = 0.05;
const cubieGroup = new THREE.Group();
const cubieMap = {}; // key: "x,y,z" → { mesh, materials, pos }
const cubieMeshes = []; // for raycasting

const DARK_COLOR = 0x1a1a2e;

// 计算边框颜色：取面颜色的 40%-70% 亮度，深色面自动变亮，亮色面加深
function computeEdgeColor(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  // 感知亮度 (luminance)
  const lum = 0.299 * r + 0.587 * g + 0.114 * b;
  let factor;
  if (lum < 100) {
    factor = 1.3; // 深色面：变亮 30%
  } else if (lum > 200) {
    factor = 0.4; // 亮色面（白/黄）：加深到 40%，确保边框可见
  } else {
    factor = 0.7; // 中等亮度：70%
  }
  return [
    Math.min(255, Math.round(r * factor)),
    Math.min(255, Math.round(g * factor)),
    Math.min(255, Math.round(b * factor))
  ];
}

function createCubie(x, y, z) {
  // 判断每个面是否暴露
  const exposed = {
    front:  z === 1,
    back:   z === -1,
    left:   x === -1,
    right:  x === 1,
    top:    y === 1,
    bottom: y === -1,
  };

  const faceOrder = ['right', 'left', 'top', 'bottom', 'front', 'back'];
  const faceColors = {
    right:  exposed.right  ? FACES.right.color  : DARK_COLOR,
    left:   exposed.left   ? FACES.left.color   : DARK_COLOR,
    top:    exposed.top    ? FACES.top.color    : DARK_COLOR,
    bottom: exposed.bottom ? FACES.bottom.color : DARK_COLOR,
    front:  exposed.front  ? FACES.front.color  : DARK_COLOR,
    back:   exposed.back   ? FACES.back.color   : DARK_COLOR,
  };

  const materials = faceOrder.map(f => new THREE.MeshStandardMaterial({
    color: faceColors[f],
    roughness: 0.45,
    metalness: 0.02,
  }));

  const geo = new THREE.BoxGeometry(CUBIE_SIZE, CUBIE_SIZE, CUBIE_SIZE);
  const mesh = new THREE.Mesh(geo, materials);
  mesh.position.set(x * (CUBIE_SIZE + CUBIE_GAP), y * (CUBIE_SIZE + CUBIE_GAP), z * (CUBIE_SIZE + CUBIE_GAP));

  // 边框：颜色根据面颜色动态计算，透明度根据主题
  const edges = new THREE.EdgesGeometry(geo);
  const edgeOpacity = getThemeEdgeOpacity();
  const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: getThemeEdgeColor(), transparent: true, opacity: edgeOpacity }));
  line.raycast = () => {};
  mesh.add(line);

  return { mesh, materials, faceOrder, exposed, line };
}

// 生成所有 cubie（排除中心块）
for (let x = -1; x <= 1; x++) {
  for (let y = -1; y <= 1; y++) {
    for (let z = -1; z <= 1; z++) {
      if (x === 0 && y === 0 && z === 0) continue;
      const key = `${x},${y},${z}`;
      const { mesh, materials, faceOrder, exposed } = createCubie(x, y, z);
      cubieGroup.add(mesh);
      cubieMap[key] = { mesh, materials, faceOrder, exposed, x, y, z };
      cubieMeshes.push(mesh);
    }
  }
}

// 锁定状态：已移除 🔒 图标，改用颜色明暗区分三态
//   - locked: 暗色 #1a1a2e（与魔方内部一致）
//   - unlocked: 面颜色 50% 亮度（半透明，可见但偏暗）

// ============================================================
// 动画系统：脉冲 + 完成动画
// ============================================================
const activeAnimations = [];

function addPulseAnimation(mesh) {
  // 移除同一 mesh 的旧动画
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    if (activeAnimations[i].mesh === mesh && activeAnimations[i].type === 'pulse') {
      activeAnimations.splice(i, 1);
    }
  }

  const anim = {
    type: 'pulse',
    mesh,
    startTime: performance.now(),
    duration: 300,
    originalScale: mesh.scale.clone(),
  };
  activeAnimations.push(anim);
}

function addCompletionAnimation(mesh, materials, faceOrder, faceId, baseColor) {
  // 移除同一 mesh 的旧完成动画
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    if (activeAnimations[i].mesh === mesh && activeAnimations[i].type === 'complete') {
      activeAnimations.splice(i, 1);
    }
  }

  const matIdx = faceOrder.indexOf(faceId === 'front' ? 'front' : faceId === 'back' ? 'back' : faceId === 'left' ? 'left' : faceId === 'right' ? 'right' : faceId === 'top' ? 'top' : 'bottom');
  if (matIdx === -1) return;

  const anim = {
    type: 'complete',
    mesh,
    startTime: performance.now(),
    duration: 650,
    originalScale: mesh.scale.clone(),
    materials,
    matIdx,
    targetColor: new THREE.Color(baseColor),
    startColor: new THREE.Color(halfBrightnessDynamic(baseColor)),
  };
  activeAnimations.push(anim);
}

function updateAnimations() {
  const now = performance.now();
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    const anim = activeAnimations[i];
    const elapsed = now - anim.startTime;
    const t = Math.min(elapsed / anim.duration, 1);

    if (anim.type === 'pulse') {
      // 缓出脉冲
      const scale = 1 + 0.08 * Math.sin(t * Math.PI) * (1 - t);
      anim.mesh.scale.setScalar(scale);
      if (t >= 1) {
        anim.mesh.scale.copy(anim.originalScale);
        activeAnimations.splice(i, 1);
      }
    } else if (anim.type === 'complete') {
      // 颜色渐变 + 柔和缩放，避免移动整个 cubie 破坏魔方结构
      const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
      const color = new THREE.Color().lerpColors(anim.startColor, anim.targetColor, ease);
      anim.materials[anim.matIdx].color.copy(color);
      anim.materials[anim.matIdx].emissive.copy(color);
      anim.materials[anim.matIdx].emissiveIntensity = 0.5 * ease;
      const scale = 1 + Math.sin(t * Math.PI) * 0.07;
      anim.mesh.scale.copy(anim.originalScale).multiplyScalar(scale);

      if (t >= 1) {
        anim.mesh.scale.copy(anim.originalScale);
        anim.materials[anim.matIdx].color.copy(anim.targetColor);
        anim.materials[anim.matIdx].emissive.copy(anim.targetColor);
        anim.materials[anim.matIdx].emissiveIntensity = 0.5;
        activeAnimations.splice(i, 1);
      }
    } else if (anim.type === 'shake') {
      // 摇晃效果
      const intensity = (1 - t) * 0.08;
      const shakeX = Math.sin(t * 20) * intensity;
      const shakeY = Math.cos(t * 17) * intensity;
      anim.mesh.position.x = anim.originalPos.x + shakeX;
      anim.mesh.position.y = anim.originalPos.y + shakeY;
      if (t >= 1) {
        anim.mesh.position.copy(anim.originalPos);
        activeAnimations.splice(i, 1);
      }
    }
  }
}

// 锁定格子摇晃动画
function shakeLockedCubie(mesh) {
  for (let i = activeAnimations.length - 1; i >= 0; i--) {
    if (activeAnimations[i].mesh === mesh && activeAnimations[i].type === 'shake') {
      activeAnimations.splice(i, 1);
    }
  }
  const anim = {
    type: 'shake',
    mesh,
    startTime: performance.now(),
    duration: 400,
    originalPos: mesh.position.clone(),
  };
  activeAnimations.push(anim);
}

// 进度管理

const STORAGE_KEY = 'cube_english_progress';

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveProgress(progress) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
}

function getCellKey(faceId, row, col) {
  return `${currentDifficulty}_${faceId}_${row}_${col}`;
}

function getCellState(faceId, row, col) {
  const progress = loadProgress();
  const key = getCellKey(faceId, row, col);
  if (progress[key] === 'completed') return 'completed';
  // 解锁逻辑：每个面的关卡按顺序解锁 (row*3+col 顺序)
  const order = row * 3 + col;
  if (order === 0) return 'unlocked';
  // 检查前一关是否完成
  const prevRow = Math.floor((order - 1) / 3);
  const prevCol = (order - 1) % 3;
  const prevKey = getCellKey(faceId, prevRow, prevCol);
  return progress[prevKey] === 'completed' ? 'unlocked' : 'locked';
}

function markCompleted(faceId, row, col) {
  const progress = loadProgress();
  progress[getCellKey(faceId, row, col)] = 'completed';
  saveProgress(progress);
  updateSingleCubieFace(faceId, row, col);
  updateHeaderStats();
}

// 将 hex 颜色转换为 50% 亮度版本（用于 unlocked 状态）
function halfBrightness(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return '#' + [r, g, b].map(c => Math.round(c * 0.5).toString(16).padStart(2, '0')).join('');
}

// 局部更新单个 cubie 的单个面颜色（替代 updateAllCubieColors 全量遍历）
function updateSingleCubieFace(faceId, row, col) {
  const face = FACES[faceId];
  const [nx, ny, nz] = face.normal;
  for (const key in cubieMap) {
    const cubie = cubieMap[key];
    if (!cubie.exposed[faceId]) continue;
    const cell = getFaceCell(cubie.x, cubie.y, cubie.z, nx, ny, nz);
    if (cell && cell.row === row && cell.col === col) {
      const matIdx = cubie.faceOrder.indexOf(faceId);
      if (matIdx === -1) return;
      const state = getCellState(faceId, row, col);
      const color = face.color;
      if (state === 'completed') {
        cubie.materials[matIdx].color.set(color);
        cubie.materials[matIdx].emissive.set(color);
        cubie.materials[matIdx].emissiveIntensity = 0.5;
      } else if (state === 'locked') {
        cubie.materials[matIdx].color.set(DARK_COLOR_DYNAMIC());
        cubie.materials[matIdx].emissive.set(0x000000);
        cubie.materials[matIdx].emissiveIntensity = 0;
      } else {
        cubie.materials[matIdx].color.set(halfBrightnessDynamic(color));
        cubie.materials[matIdx].emissive.set(color);
        cubie.materials[matIdx].emissiveIntensity = 0.14;
      }
      return;
    }
  }
}

function getTotalCompleted() {
  const progress = loadProgress();
  const difficultyPrefix = `${currentDifficulty}_`;
  return Object.entries(progress).filter(([key, value]) => key.startsWith(difficultyPrefix) && value === 'completed').length;
}

function getFaceCompleted(faceId) {
  const progress = loadProgress();
  let count = 0;
  for (let row = 0; row < 3; row++) {
    for (let col = 0; col < 3; col++) {
      if (progress[getCellKey(faceId, row, col)] === 'completed') count++;
    }
  }
  return count;
}

// ============================================================
// 更新 cubie 颜色（根据完成状态）
// ============================================================
function updateAllCubieColors() {
  const progress = loadProgress();
  for (const key in cubieMap) {
    const [x, y, z] = key.split(',').map(Number);
    const { materials, faceOrder, exposed } = cubieMap[key];

    for (const faceId of Object.keys(FACES)) {
      if (!exposed[faceId]) continue;
      const cell = getFaceCell(x, y, z, ...FACES[faceId].normal);
      if (!cell) continue;
      const state = getCellState(faceId, cell.row, cell.col);
      const matIdx = faceOrder.indexOf(faceId === 'front' ? 'front' : faceId === 'back' ? 'back' : faceId === 'left' ? 'left' : faceId === 'right' ? 'right' : faceId === 'top' ? 'top' : 'bottom');
      if (matIdx === -1) continue;

      const baseColor = FACES[faceId].color;
      if (state === 'completed') {
        materials[matIdx].color.set(baseColor);
        materials[matIdx].emissive.set(baseColor);
        materials[matIdx].emissiveIntensity = 0.5;
      } else if (state === 'locked') {
        materials[matIdx].color.set(DARK_COLOR_DYNAMIC());
        materials[matIdx].emissive.set(0x000000);
        materials[matIdx].emissiveIntensity = 0;
      } else {
        // 解锁未完成：面颜色可变亮度（根据主题动态变化）
        materials[matIdx].color.set(halfBrightnessDynamic(baseColor));
        materials[matIdx].emissive.set(baseColor);
        materials[matIdx].emissiveIntensity = 0.14;
      }
    }
  }
}

// 更新所有边框透明度（主题切换时调用）
function updateAllEdgeOpacity() {
  const opacity = getThemeEdgeOpacity();
  for (const key in cubieMap) {
    const cubie = cubieMap[key];
    if (cubie.line && cubie.line.material) {
      cubie.line.material.opacity = opacity;
      cubie.line.material.color.set(getThemeEdgeColor());
    }
  }
}

let cameraTransitionFrame = null;

function getQuestionFocusDistance() {
  if (window.innerWidth < 400) return 8.5;
  if (window.innerWidth < 600) return 7.5;
  return 6.5;
}

function findCubieForCell(faceId, cell) {
  const face = FACES[faceId];
  for (const key in cubieMap) {
    const cubie = cubieMap[key];
    if (!cubie.exposed[faceId]) continue;
    const mappedCell = getFaceCell(cubie.x, cubie.y, cubie.z, ...face.normal);
    if (mappedCell && mappedCell.row === cell.row && mappedCell.col === cell.col) return cubie;
  }
  return null;
}

function animateCameraTo(faceId, focusPoint, callback) {
  const face = FACES[faceId];
  const normal = new THREE.Vector3(...face.normal);
  const targetPosition = focusPoint.clone().add(normal.multiplyScalar(getQuestionFocusDistance()));
  const start = camera.position.clone();
  const startTarget = controls.target.clone();
  const startTime = performance.now();
  const duration = 700;

  if (cameraTransitionFrame !== null) cancelAnimationFrame(cameraTransitionFrame);
  if (rotateRestoreTimer !== null) {
    clearTimeout(rotateRestoreTimer);
    rotateRestoreTimer = null;
  }
  controls.autoRotate = false;
  controls.enabled = false;

  function anim(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = t * t * (3 - 2 * t);

    camera.position.lerpVectors(start, targetPosition, ease);
    controls.target.lerpVectors(startTarget, focusPoint, ease);
    controls.update();

    if (t < 1) {
      cameraTransitionFrame = requestAnimationFrame(anim);
    } else {
      cameraTransitionFrame = null;
      controls.enabled = true;
      if (callback) callback();
    }
  }
  cameraTransitionFrame = requestAnimationFrame(anim);
}

// 平滑定位到指定面或具体方块
function faceCameraToFace(faceId, callback) {
  animateCameraTo(faceId, new THREE.Vector3(0, 0, 0), callback);
}

function faceCameraToCell(faceId, cell, callback) {
  const cubie = findCubieForCell(faceId, cell);
  animateCameraTo(faceId, cubie ? cubie.mesh.position.clone() : new THREE.Vector3(0, 0, 0), callback);
}

// ============================================================
// 点击检测 (Raycaster)
// ============================================================
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let currentQuestion = null;
let currentFaceId = null;
let currentCell = null;
let selectedOption = null;
let answered = false;

// 指针事件：pointerdown + pointerup 替代 click，解决移动端拖拽误触和 300ms 延迟
let pointerDownX = 0, pointerDownY = 0;
let isDragging = false;
let rotateRestoreTimer = null;

canvas.addEventListener('pointerdown', (e) => {
  pointerDownX = e.clientX;
  pointerDownY = e.clientY;
  isDragging = false;

  // 用户开始交互，立即暂停自动旋转
  controls.autoRotate = false;
  // 清除之前的恢复计时器，防止频繁拖拽时误恢复
  if (rotateRestoreTimer !== null) {
    clearTimeout(rotateRestoreTimer);
    rotateRestoreTimer = null;
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (isDragging) return;
  const dx = e.clientX - pointerDownX;
  const dy = e.clientY - pointerDownY;
  if (Math.sqrt(dx * dx + dy * dy) > 10) {
    isDragging = true;
    canvas.style.cursor = 'grabbing';
  }
});

canvas.addEventListener('pointerup', (e) => {
  canvas.style.cursor = 'grab';

  // 清除之前的恢复计时器（防重复）
  if (rotateRestoreTimer !== null) {
    clearTimeout(rotateRestoreTimer);
    rotateRestoreTimer = null;
  }

  // 延迟 3 秒后恢复自动旋转（平滑过渡）
  rotateRestoreTimer = setTimeout(() => {
    controls.autoRotate = !prefersReducedMotion.matches;
    // 平滑过渡：从 0 逐渐加速到目标速度
    const targetSpeed = 0.5;
    const rampDuration = 1000; // 1 秒过渡
    const startTime = performance.now();
    const startSpeed = 0;

    function rampUp(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / rampDuration, 1);
      // easeOutCubic 缓动
      const eased = 1 - Math.pow(1 - t, 3);
      controls.autoRotateSpeed = startSpeed + (targetSpeed - startSpeed) * eased;
      if (t < 1) {
        requestAnimationFrame(rampUp);
      }
    }
    requestAnimationFrame(rampUp);
    rotateRestoreTimer = null;
  }, 3000);

  if (isDragging) return;
  if (document.getElementById('modal-overlay').classList.contains('active')) return;

  const dx = e.clientX - pointerDownX;
  const dy = e.clientY - pointerDownY;
  const dist = Math.sqrt(dx * dx + dy * dy);

  // 移动超过 10px 视为拖拽，不触发点击
  if (dist > 10) return;

  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(cubieMeshes);

  if (intersects.length > 0) {
    const intersect = intersects[0];
    let hitObj = intersect.object;
    // 如果射线命中的是子对象（如边框），向上查找父级 Mesh
    if (!(hitObj instanceof THREE.Mesh)) {
      hitObj = hitObj.parent;
    }

    let cubieData = null;
    for (const key in cubieMap) {
      if (cubieMap[key].mesh === hitObj) {
        cubieData = cubieMap[key];
        break;
      }
    }
    if (!cubieData) return;

    const normal = intersect.face.normal.clone();
    normal.transformDirection(hitObj.matrixWorld);
    normal.x = Math.round(normal.x);
    normal.y = Math.round(normal.y);
    normal.z = Math.round(normal.z);

    const faceId = getFaceFromNormal(normal.x, normal.y, normal.z);
    if (!faceId || !cubieData.exposed[faceId]) return;

    const cell = getFaceCell(cubieData.x, cubieData.y, cubieData.z, normal.x, normal.y, normal.z);
    if (!cell) return;

    const state = getCellState(faceId, cell.row, cell.col);

    if (state === 'locked') {
      // 锁定格子摇晃动画
      shakeLockedCubie(cubieData.mesh);
      showLockedModal(faceId, cell);
      return;
    }

    faceCameraToCell(faceId, cell, () => {
      addPulseAnimation(cubieData.mesh);
      openQuestionModal(faceId, cell);
    });
  }
});

// 鼠标悬停时改变光标，锁定格子显示 tooltip
canvas.addEventListener('mousemove', (event) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(cubieMeshes);

  const tooltip = document.getElementById('lock-hover-tooltip');

  if (intersects.length > 0) {
    const intersect = intersects[0];
    let hitObj = intersect.object;
    if (!(hitObj instanceof THREE.Mesh)) hitObj = hitObj.parent;

    let cubieData = null;
    for (const key in cubieMap) {
      if (cubieMap[key].mesh === hitObj) { cubieData = cubieMap[key]; break; }
    }

    if (cubieData) {
      const face = intersect.face;
      const normal = face.normal.clone();
      normal.transformDirection(hitObj.matrixWorld);
      const nx = Math.round(normal.x), ny = Math.round(normal.y), nz = Math.round(normal.z);
      const faceId = getFaceFromNormal(nx, ny, nz);
      if (faceId) {
        const cell = getFaceCell(cubieData.x, cubieData.y, cubieData.z, nx, ny, nz);
        if (cell) {
          const state = getCellState(faceId, cell.row, cell.col);
          if (state === 'locked') {
            canvas.style.cursor = 'not-allowed';
            tooltip.style.left = (event.clientX + 16) + 'px';
            tooltip.style.top = (event.clientY - 30) + 'px';
            tooltip.classList.add('show');
            return;
          }
        }
      }
    }
    canvas.style.cursor = 'pointer';
  } else {
    canvas.style.cursor = 'grab';
  }
  tooltip.classList.remove('show');
});

// 浮动按钮：打开第一个未完成的关卡
window.startFirstQuestion = function() {
  // 按面顺序查找第一个未完成的关卡（使用面 ID）
  const faceOrder = ['front', 'back', 'left', 'right', 'top', 'bottom'];
  for (const faceId of faceOrder) {
    for (let order = 0; order < 9; order++) {
      const row = Math.floor(order / 3);
      const col = order % 3;
      const state = getCellState(faceId, row, col);
      if (state === 'unlocked') {
        faceCameraToCell(faceId, { row, col }, () => {
          openQuestionModal(faceId, { row, col });
        });
        return;
      }
    }
  }
  // 全部完成
  const diffLabels = { easy: '小学', medium: '初中', hard: '高中' };
  alert(`恭喜！你已经完成了${diffLabels[currentDifficulty]}难度的所有54个关卡！`);
};

let currentClozeBlank = 1; // 当前激活的完形填空空格
let currentWordbankBlank = 1; // 当前激活的选词填空空格

const TYPE_LABELS = { choice: '选择题', cloze: '完形填空', wordbank: '选词填空', grammar: '语法填空' };
const TYPE_CLASSES = { choice: 'type-choice', cloze: 'type-cloze', wordbank: 'type-wordbank', grammar: 'type-grammar' };

function openQuestionModal(faceId, cell) {

// ---- 完形填空渲染 ----
function renderClozeQuestion(q) {
  const optionsList = document.getElementById('options-list');
  // 显示短文
  let passageHtml = q.passage;
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const placeholder = clozeAnswers[num] !== undefined ? (q.blanks[i].options[clozeAnswers[num]] || '___') : '___';
    passageHtml = passageHtml.replace(`___ (${num})`, `<span class="cloze-blank" data-blank="${num}" id="cloze-blank-${num}">${placeholder}</span>`);
  });
  document.getElementById('modal-question').innerHTML = `<div class="cloze-passage">${passageHtml}</div>`;

  // 显示每个空格选项
  (q.blanks || []).forEach((blank, i) => {
    const num = i + 1;
    const group = document.createElement('div');
    group.className = 'cloze-options-group';
    group.id = `cloze-options-${num}`;
    group.innerHTML = `<div class="cloze-options-label">空格 ${num}：</div><div class="cloze-options-row"></div>`;
    const row = group.querySelector('.cloze-options-row');
    blank.options.forEach((opt, j) => {
      const btn = document.createElement('button');
      btn.className = 'cloze-option';
      if (clozeAnswers[num] === j) btn.classList.add('selected-opt');
      btn.textContent = opt;
      btn.onclick = () => selectClozeOption(num, j, blank.options[j]);
      row.appendChild(btn);
    });
    optionsList.appendChild(group);
  });

  // 点击空格切换
  document.querySelectorAll('.cloze-blank').forEach(el => {
    el.addEventListener('click', () => {
      currentClozeBlank = parseInt(el.dataset.blank);
      updateClozeBlankHighlight();
    });
  });
  if (q.blanks && q.blanks.length > 0) currentClozeBlank = 1;
  updateClozeBlankHighlight();
  updateSubmitButtonState();
}

function selectClozeOption(blankId, index, text) {
  if (answered) return;
  clozeAnswers[blankId] = index;
  const blankEl = document.getElementById(`cloze-blank-${blankId}`);
  if (blankEl) { blankEl.textContent = text; blankEl.classList.add('filled'); }
  // 更新选项高亮
  const group = document.getElementById(`cloze-options-${blankId}`);
  if (group) {
    group.querySelectorAll('.cloze-option').forEach((b, i) => {
      b.classList.toggle('selected-opt', i === index);
    });
