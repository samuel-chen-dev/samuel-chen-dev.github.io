<style>
/* ============================================================
   全局样式
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* ============================================================
   CSS 变量 - 主题系统
   ============================================================ */
:root {
  --bg-primary: #080d14;
  --bg-secondary: #111b29;
  --bg-tertiary: #09141c;
  --bg-card: rgba(12,20,31,0.82);
  --bg-card-solid: #121d2a;
  --bg-panel: rgba(10,18,28,0.72);
  --bg-passage: rgba(255,255,255,0.05);
  --bg-item: rgba(255,255,255,0.04);
  --border-color: rgba(255,255,255,0.1);
  --border-light: rgba(255,255,255,0.06);
  --text-primary: #f1f5f4;
  --text-secondary: #aab9c3;
  --text-title: #ffffff;
  --text-muted: #71828d;
  --text-option: #e5ecea;
  --accent: #42dfc0;
  --accent-strong: #24b99f;
  --accent-soft: rgba(66,223,192,0.14);
  --reward: #f0c56a;
  --success: #48c78e;
  --danger: #ff6b6b;
  --btn-bg: rgba(255,255,255,0.04);
  --btn-text: #b2c0ca;
  --btn-active-bg: rgba(66,223,192,0.18);
  --btn-active-text: #fff;
  --btn-hover-bg: rgba(255,255,255,0.1);
  --btn-hover-border: rgba(255,255,255,0.2);
  --modal-bg: rgba(14,23,35,0.96);
  --overlay-bg: rgba(3,8,14,0.84);
  --modal-border: rgba(66,223,192,0.2);
  --option-bg: rgba(255,255,255,0.06);
  --option-text: #ddd;
  --progress-bg: rgba(255,255,255,0.06);
  --hint-color: rgba(255,255,255,0.35);
  --header-bg: rgba(255,255,255,0.06);
  --stat-text: #aab9c3;
  --lock-color: #202e3b;
  --lock-unlocked-alpha: 0.76;
  --cubie-inner: #0d151f;
  --cubie-edge: #566879;
  --confirm-bg: rgba(14,23,35,0.98);
  --confirm-border: rgba(255,255,255,0.12);
}

[data-theme="light"] {
  --bg-primary: #eef3f4;
  --bg-secondary: #ffffff;
  --bg-tertiary: #e7eff1;
  --bg-card: rgba(255,255,255,0.85);
  --bg-card-solid: #ffffff;
  --bg-panel: rgba(255,255,255,0.7);
  --bg-passage: rgba(0,0,0,0.04);
  --bg-item: rgba(0,0,0,0.04);
  --border-color: rgba(0,0,0,0.08);
  --border-light: rgba(0,0,0,0.04);
  --text-primary: #18262d;
  --text-secondary: #51656f;
  --text-title: #102129;
  --text-muted: #73858d;
  --text-option: #203038;
  --accent: #087f6d;
  --accent-strong: #056555;
  --accent-soft: rgba(8,127,109,0.1);
  --reward: #9a6811;
  --success: #197a50;
  --danger: #c53e49;
  --btn-bg: rgba(0,0,0,0.04);
  --btn-text: #6b6a66;
  --btn-active-bg: rgba(8,127,109,0.12);
  --btn-active-text: #102129;
  --btn-hover-bg: rgba(0,0,0,0.06);
  --btn-hover-border: rgba(0,0,0,0.15);
  --modal-bg: rgba(255,255,255,0.98);
  --overlay-bg: rgba(20,35,45,0.34);
  --modal-border: rgba(8,127,109,0.2);
  --option-bg: rgba(0,0,0,0.04);
  --option-text: #2d2a24;
  --progress-bg: rgba(0,0,0,0.08);
  --hint-color: rgba(0,0,0,0.25);
  --header-bg: rgba(0,0,0,0.04);
  --stat-text: #6b6a66;
  --lock-color: #c9d5d8;
  --lock-unlocked-alpha: 0.72;
  --cubie-inner: #dde6e8;
  --cubie-edge: #7d9098;
  --confirm-bg: rgba(255,255,255,0.95);
  --confirm-border: rgba(0,0,0,0.12);
}

/* 主题切换过渡 */
body, .header, .progress-panel, .modal-overlay, .modal-box, .option-btn,
.header-top, .header-stats, .panel-header, .panel-body, .confirm-box, .hint-bar,
.diff-btn, .cloze-passage, .wordbank-passage, .grammar-passage, .cloze-option,
.wordbank-tag, .wordbank-tags, .feedback-area, .modal-passage, .theme-toggle {
  transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
}

body {
  font-family: "Avenir Next", "Trebuchet MS", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: radial-gradient(ellipse at 50% 58%, rgba(66,223,192,0.1) 0%, transparent 54%),
              radial-gradient(circle at 80% 12%, rgba(240,197,106,0.055) 0%, transparent 28%),
              linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: pan-x pan-y;
}
#app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

/* ============================================================
   主题切换按钮
   ============================================================ */
.theme-toggle {
  background: var(--header-bg); border: 1px solid var(--border-light);
  border-radius: 50%; width: 34px; height: 34px; font-size: 1rem;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.3s ease; line-height: 1; padding: 0;
}
.theme-toggle:hover { background: var(--btn-hover-bg); transform: rotate(15deg); }
.ui-icon, .lucide { width: 16px; height: 16px; stroke-width: 2; pointer-events: none; flex: 0 0 auto; }
.theme-toggle .ui-icon, .theme-toggle .lucide { width: 17px; height: 17px; }
.brand-cube { width: 25px; height: 25px; flex: 0 0 auto; filter: drop-shadow(0 3px 7px rgba(0,0,0,0.3)); }

/* ============================================================
   顶部信息栏
   ============================================================ */
.header {
  position: absolute; top: 0; left: 0; right: 0; z-index: 10;
  padding: 12px 16px;
  display: flex; flex-direction: column; gap: 6px;
  pointer-events: none;
}
.header-top {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 6px;
  position: relative;
  pointer-events: auto;
}
.header-top::after {
  content: ''; position: absolute; bottom: -4px; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--reward) 42%, transparent), transparent);
}
.header-title {
  display: inline-flex; align-items: center; gap: 8px;
  font-size: 1.2rem; font-weight: 700; color: var(--text-title);
  letter-spacing: 0; text-shadow: 0 0 24px color-mix(in srgb, var(--accent) 28%, transparent);
  animation: titleBreath 3s ease-in-out infinite;
}
@keyframes titleBreath {
  0%, 100% { text-shadow: 0 0 20px color-mix(in srgb, var(--accent) 22%, transparent); }
  50% { text-shadow: 0 0 32px color-mix(in srgb, var(--accent) 42%, transparent); }
}
.header-stats { font-size: 0.75rem; color: var(--stat-text); background: var(--header-bg); padding: 4px 12px; border-radius: 8px; backdrop-filter: blur(10px); border: 1px solid var(--border-light); }
.header-stats span { color: var(--reward); font-weight: 700; }
.header-diff-badge {
  font-size: 0.7rem; font-weight: 600; color: var(--reward);
  background: color-mix(in srgb, var(--reward) 10%, transparent); padding: 3px 10px; border-radius: 7px;
  border: 1px solid color-mix(in srgb, var(--reward) 22%, transparent);
}
.header-action-btn {
  background: var(--header-bg); border: 1px solid var(--border-light);
  border-radius: 8px; color: var(--text-secondary); font-size: 0.85rem;
  width: 32px; height: 32px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.2s; line-height: 1;
}
.header-action-btn:hover { background: var(--btn-hover-bg); color: var(--text-title); border-color: var(--btn-hover-border); transform: translateY(-1px); }
.header-actions { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.difficulty-selector { position: relative; z-index: 30; }
.diff-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 5px 16px; border-radius: 7px; border: 1px solid var(--border-color);
  background: var(--btn-bg); color: var(--btn-text); font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}
.difficulty-menu {
  display: none; position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  width: min(340px, calc(100vw - 24px)); max-height: min(70vh, 520px); overflow-y: auto;
  padding: 8px; border: 1px solid var(--border-color); border-radius: 8px;
  z-index: 40; background: var(--bg-card-solid); box-shadow: 0 18px 50px rgba(0,0,0,0.5);
}
.difficulty-menu.open { display: grid; gap: 5px; }
.difficulty-card {
  width: 100%; display: grid; grid-template-columns: 5px 1fr auto; gap: 10px; align-items: center;
  padding: 10px; border: 1px solid transparent; border-radius: 7px; background: var(--bg-item);
  color: var(--text-primary); text-align: left; cursor: pointer;
}
.difficulty-card:hover, .difficulty-card.active { border-color: var(--difficulty-color); background: var(--btn-hover-bg); }
.difficulty-card-color { align-self: stretch; border-radius: 3px; background: var(--difficulty-color); }
.difficulty-card strong { display: block; font-size: 0.86rem; color: var(--text-title); }
.difficulty-card small { display: block; margin-top: 2px; font-size: 0.7rem; color: var(--text-secondary); }
.difficulty-card-grade { font-size: 0.68rem; color: var(--difficulty-color); white-space: nowrap; }
.diff-btn:hover {
  border-color: var(--accent); color: var(--text-title);
  transform: translateY(-1px);
}
.diff-btn.active {
  background: var(--accent-soft); border-color: var(--accent); color: var(--btn-active-text);
  box-shadow: 0 0 18px color-mix(in srgb, var(--accent) 22%, transparent);
}

/* 悬浮迷你进度面板 - 顶部 */
.progress-panel {
  position: relative; z-index: 1; margin-top: 8px;
  background: var(--bg-panel); backdrop-filter: blur(10px);
  border-radius: 8px; border: 1px solid var(--border-color);
  overflow: hidden; transition: all 0.35s ease;
  pointer-events: auto;
}
.cube-focused .progress-panel {
  opacity: 0; transform: translateY(-10px);
  pointer-events: none;
}
.panel-header {
  display: flex; align-items: center; gap: 10px; padding: 0 14px;
  height: 44px; cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.panel-header:hover { background: var(--btn-hover-bg); }
.panel-icon { font-size: 1.1rem; }
.panel-icon { display: inline-flex; color: var(--accent); }
#panel-title { display: inline-flex; align-items: center; gap: 8px; }
.panel-reset-all { display: flex; align-items: center; justify-content: center; gap: 6px; }
.panel-reset-btn { display: inline-flex; align-items: center; justify-content: center; }
.panel-reset-btn .lucide { width: 12px; height: 12px; }
.panel-toggle { display: inline-flex; align-items: center; justify-content: center; }
.panel-title { font-size: 0.8rem; color: var(--text-secondary); font-weight: 600; }
.panel-progress-text { font-size: 0.8rem; color: var(--text-title); font-weight: 700; white-space: nowrap; }
.panel-progress-bar {
  flex: 1; height: 6px; background: var(--progress-bg); border-radius: 3px;
  overflow: hidden; min-width: 40px;
}
.panel-progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent), var(--reward));
  box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent);
  transition: width 0.4s ease;
}
.panel-percent { font-size: 0.75rem; color: var(--text-secondary); font-weight: 600; min-width: 35px; text-align: right; }
.panel-toggle {
  background: none; border: none; color: var(--text-secondary); font-size: 0.75rem;
  cursor: pointer; padding: 4px; transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
.panel-toggle.open { transform: rotate(90deg); }
.panel-body {
  max-height: 0; overflow: hidden; opacity: 0;
  transform: translateY(-4px);
  transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1),
              opacity 0.35s ease,
              transform 0.35s ease,
              padding 0.3s ease;
  padding: 0 14px; display: flex; flex-direction: column; gap: 2px;
}
.panel-body.open {
  max-height: 72px; overflow-y: auto; padding: 0 8px 5px;
  opacity: 1; transform: translateY(0);
}
.panel-body-row {
  display: flex; gap: 8px;
}
.panel-body-item {
  flex: 1; display: flex; align-items: center; gap: 4px;
  font-size: 0.65rem; color: var(--text-secondary); cursor: pointer;
  padding: 3px 6px; border-radius: 8px; transition: background 0.2s;
  white-space: nowrap;
  opacity: 0; transform: translateY(-4px);
}
.panel-body.open .panel-body-item {
  opacity: 1; transform: translateY(0);
}
.panel-body.open .panel-body-item:nth-child(1) { transition: all 0.3s ease 0ms; }
.panel-body.open .panel-body-item:nth-child(2) { transition: all 0.3s ease 50ms; }
.panel-body.open .panel-body-item:nth-child(3) { transition: all 0.3s ease 100ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(1) { transition: all 0.3s ease 150ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(2) { transition: all 0.3s ease 200ms; }
.panel-body.open .panel-body-row:nth-child(2) .panel-body-item:nth-child(3) { transition: all 0.3s ease 250ms; }
.panel-body-item:hover { background: rgba(255,255,255,0.08); }
.panel-body-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; border: 1px solid var(--border-color); }

/* ============================================================
   3D 画布
   ============================================================ */
#cube-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

/* 点击脉冲动画 */
@keyframes cubiePulse {
  0% { transform: scale(1); filter: brightness(1); }
  50% { transform: scale(1.08); filter: brightness(1.5); }
  100% { transform: scale(1); filter: brightness(1); }
}

/* ============================================================
   确认对话框
   ============================================================ */
.confirm-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 200; background: var(--overlay-bg);
  backdrop-filter: blur(8px);
  justify-content: center; align-items: center;
}
.confirm-overlay.active { display: flex; }
.confirm-box {
  background: var(--confirm-bg);
  backdrop-filter: blur(20px);
  border: 1px solid var(--confirm-border);
  border-radius: 8px; padding: 24px;
  width: 90%; max-width: 360px;
  text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.25s ease-out;
}
.confirm-title { font-size: 1rem; font-weight: 700; color: var(--text-title); margin-bottom: 8px; }
.confirm-message { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
.confirm-buttons { display: flex; gap: 10px; justify-content: center; }
.confirm-btn {
  padding: 8px 24px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
  border: none; cursor: pointer; transition: all 0.2s;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.confirm-btn-cancel { background: var(--btn-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
.confirm-btn-cancel:hover { background: var(--btn-hover-bg); }
.confirm-btn-danger { background: linear-gradient(135deg, #e74c3c, #c0392b); color: #fff; }
.confirm-btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(231,76,60,0.3); }
.confirm-btn-warning { background: linear-gradient(135deg, #f39c12, #e67e22); color: #fff; }
.confirm-btn-warning:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(243,156,18,0.3); }

/* 面板内重置按钮 */
.panel-reset-btn {
  background: none; border: none; color: #555; font-size: 0.7rem;
  cursor: pointer; padding: 2px 4px; border-radius: 4px;
  transition: all 0.2s; margin-left: 2px; opacity: 0.5;
}
.panel-reset-btn:hover { color: #e74c3c; opacity: 1; background: rgba(231,76,60,0.1); }
.panel-reset-all {
  display: block; width: 100%; margin-top: 8px; padding: 6px 0;
  background: rgba(231,76,60,0.08); border: 1px solid rgba(231,76,60,0.2);
  border-radius: 8px; color: #e74c3c; font-size: 0.75rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; text-align: center;
}
.panel-reset-all:hover { background: rgba(231,76,60,0.15); border-color: rgba(231,76,60,0.4); }

/* ============================================================
   底部提示
   ============================================================ */
.hint-bar {
  position: absolute;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  left: 50%; transform: translateX(-50%);
  font-size: 0.7rem; color: var(--hint-color);
  pointer-events: none; z-index: 10;
  text-align: center;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  transition: opacity 0.5s ease;
  display: flex; align-items: center; justify-content: center; gap: 5px;
}

/* ============================================================
   3D 画布
   ============================================================ */
#cube-canvas { width: 100%; height: 100%; display: block; touch-action: none; }

/* ============================================================
   答题弹窗
   ============================================================ */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  z-index: 100; background: var(--overlay-bg);
  backdrop-filter: blur(8px);
  justify-content: center; align-items: flex-start;
  overflow-y: auto; padding: 20px 0;
}
.modal-overlay.active { display: flex; }
.modal-box {
  background: var(--modal-bg);
  color: var(--text-primary);
  backdrop-filter: blur(24px);
  border: 1px solid var(--modal-border);
  border-radius: 8px; padding: 16px;
  width: 96%; max-width: 480px; max-height: 85vh; overflow-y: auto;
  margin: auto;
  box-shadow: 0 0 40px rgba(74,230,201,0.06), 0 20px 60px rgba(0,0,0,0.5);
  animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1), borderGlow 0.9s ease-out 1;
}
@media (min-width: 480px) {
  .modal-box { width: 90%; padding: 24px; }
}
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
@keyframes borderGlow {
  0%, 100% { border-color: var(--modal-border); box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 5%, transparent); }
  50% { border-color: color-mix(in srgb, var(--accent) 38%, transparent); box-shadow: 0 0 38px color-mix(in srgb, var(--accent) 14%, transparent); }
}

.modal-header {
  display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;
}
.modal-face-badge {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.8rem; font-weight: 600; padding: 4px 12px;
  border-radius: 20px; color: #fff;
  box-shadow: 0 0 20px rgba(74,230,201,0.25);
}
.modal-level { font-size: 0.75rem; color: var(--text-secondary); }

.modal-title {
  display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  font-size: 0.82rem; font-weight: 600; color: var(--text-secondary);
  line-height: 1.4; margin-bottom: 16px;
}
.level-question-progress { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; }
.level-question-progress span { min-width: 32px; font-size: 0.72rem; color: var(--text-secondary); text-align: right; }
.level-question-track { flex: 1; height: 5px; overflow: hidden; border-radius: 3px; background: var(--progress-bg); }
.level-question-fill { height: 100%; border-radius: inherit; background: var(--accent); transition: width 0.3s ease; }

/* 题目类型：短文 */
.modal-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 14px 16px; font-size: 0.9rem; line-height: 1.75;
  color: var(--text-secondary); margin-bottom: 16px;
  border-left: 3px solid rgba(74,230,201,0.55);
}

[data-theme="light"] #panel-content [style*="background:rgba(255,255,255,0.04)"] {
  background: var(--bg-item) !important;
}
[data-theme="light"] #panel-content [style*="border:1px solid rgba(255,255,255,0.06)"] {
  border-color: var(--border-color) !important;
}
[data-theme="light"] #panel-content [style*="color:#fff"],
[data-theme="light"] #cert-overlay [style*="color:#fff"] { color: var(--text-title) !important; }
[data-theme="light"] #panel-content [style*="color:#ccc"],
[data-theme="light"] #panel-content [style*="color:#aaa"],
[data-theme="light"] #panel-content [style*="color:#888"],
[data-theme="light"] #cert-overlay [style*="color:#ccc"],
[data-theme="light"] #cert-overlay [style*="color:#aaa"] { color: var(--text-secondary) !important; }

/* 题目主体与选项 */
.modal-question {
  font-size: 1.2rem; font-weight: 650; color: var(--text-title);
  margin-bottom: 20px; line-height: 1.55;
}
.options-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.option-btn {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px; border-radius: 8px;
  background: var(--option-bg); border: 1px solid var(--border-color);
  color: var(--option-text); font-size: 1rem; cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); text-align: left; min-height: 44px;
}
.option-btn:hover {
  background: var(--btn-hover-bg); border-color: var(--btn-hover-border);
  transform: translateY(-2px); box-shadow: 0 4px 15px rgba(74,230,201,0.1);
}
.option-btn.selected { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.option-btn.correct { border-color: var(--success); background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); animation: correctPop 0.4s ease; }
.option-btn.wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); animation: wrongShake 0.4s ease; }
.option-btn:disabled { pointer-events: none; }
.option-letter { font-weight: 700; font-size: 1rem; opacity: 0.6; min-width: 24px; }

/* 题型标签 */
.question-type-badge {
  display: inline-block; font-size: 0.65rem; font-weight: 600;
  padding: 2px 8px; border-radius: 8px;
  vertical-align: middle;
}
.type-choice { background: var(--accent-soft); color: var(--accent); }
.type-cloze { background: rgba(86,156,214,0.14); color: #68aee5; }
.type-wordbank { background: color-mix(in srgb, var(--reward) 14%, transparent); color: var(--reward); }
.type-grammar { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.type-wordorder { background: color-mix(in srgb, #f59e0b 16%, transparent); color: #f59e0b; }
.type-matching { background: color-mix(in srgb, #22c55e 16%, transparent); color: #22c55e; }
.type-dialogue { background: color-mix(in srgb, #06b6d4 16%, transparent); color: #06b6d4; }
.level-result { text-align: center; padding: 18px 4px; }
.level-result-score { font-size: 2.4rem; font-weight: 750; color: var(--accent); margin: 8px 0; }
.level-result-status { font-size: 1rem; font-weight: 650; color: var(--text-title); margin-bottom: 8px; }

/* 完形填空 - 短文中的空格 */
.cloze-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 16px; font-size: 1.05rem; font-weight: 500; line-height: 2;
  color: var(--text-primary); margin-bottom: 16px;
}
.cloze-blank {
  display: inline-block; min-width: 80px; text-align: center;
  border-bottom: 2px dashed rgba(74,230,201,0.5);
  padding: 0 6px; margin: 0 2px; color: #4ae6c9; font-weight: 600;
  cursor: default; transition: all 0.2s;
}
.cloze-blank.filled { border-bottom-color: #4ae6c9; }
.cloze-blank.current { background: rgba(74,230,201,0.1); border-bottom-color: #4ae6c9; }
.cloze-blank.correct-blank { border-bottom-color: #27ae60; color: #27ae60; }
.cloze-blank.wrong-blank { border-bottom-color: #e74c3c; color: #e74c3c; }
.cloze-options-group { margin-bottom: 10px; }
.cloze-options-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
.cloze-options-row { display: flex; gap: 6px; flex-wrap: wrap; }
.cloze-option {
  padding: 6px 14px; border-radius: 8px; font-size: 0.85rem;
  background: var(--option-bg); border: 1px solid var(--border-color);
  color: var(--option-text); cursor: pointer; transition: all 0.15s;
}
.cloze-option:hover { background: var(--btn-hover-bg); border-color: var(--btn-hover-border); }
.cloze-option.selected-opt { border-color: #4ae6c9; background: rgba(74,230,201,0.15); color: #4ae6c9; }
.cloze-option.correct-opt { border-color: #27ae60; background: rgba(39,174,96,0.2); color: #27ae60; }
.cloze-option.wrong-opt { border-color: #e74c3c; background: rgba(231,76,60,0.2); color: #e74c3c; }

/* 选词填空 */
.wordbank-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 16px; font-size: 1.05rem; font-weight: 500; line-height: 2;
  color: var(--text-primary); margin-bottom: 16px;
}
.wordbank-blank {
  display: inline-block; min-width: 80px; text-align: center;
  border-bottom: 2px dashed rgba(253,203,110,0.5);
  padding: 0 6px; margin: 0 2px; color: #fdcb6e; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border-radius: 2px;
}
.wordbank-blank.filled { border-bottom-style: solid; }
.wordbank-blank.current { background: rgba(253,203,110,0.1); }
.wordbank-blank.correct-blank { border-bottom-color: #27ae60; color: #27ae60; }
.wordbank-blank.wrong-blank { border-bottom-color: #e74c3c; color: #e74c3c; }
.wordbank-tags {
  display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
  padding: 10px; background: var(--bg-passage); border-radius: 10px;
  border: 1px solid var(--border-light);
}
.wordbank-tag {
  padding: 6px 14px; border-radius: 8px; font-size: 0.85rem;
  background: rgba(253,203,110,0.1); border: 1px solid rgba(253,203,110,0.25);
  color: #fdcb6e; cursor: pointer; transition: all 0.15s;
}
.wordbank-tag:hover { background: rgba(253,203,110,0.2); border-color: rgba(253,203,110,0.4); }
.wordbank-tag.used { opacity: 0.3; pointer-events: none; text-decoration: line-through; }

/* 语法填空 */
.grammar-passage {
  background: var(--bg-passage); border-radius: 10px;
  padding: 16px; font-size: 1.05rem; font-weight: 500; line-height: 2;
  color: var(--text-primary); margin-bottom: 16px;
}
.grammar-input {
  display: inline-block; width: 120px; padding: 4px 8px;
  background: var(--option-bg); border: 1px solid rgba(255,107,107,0.3);
  border-radius: 6px; color: var(--text-title); font-size: 0.85rem; text-align: center;
  margin: 0 4px; outline: none; transition: all 0.2s;
}
.grammar-input:focus { border-color: #ff6b6b; box-shadow: 0 0 8px rgba(255,107,107,0.2); }
.grammar-input.correct-input { border-color: #27ae60; background: rgba(39,174,96,0.1); }
.grammar-input.wrong-input { border-color: #e74c3c; background: rgba(231,76,60,0.1); }
.grammar-hint { font-size: 0.7rem; color: var(--text-muted); margin-left: 2px; }

/* 连词成句、匹配题、补全对话 */
.wordorder-zone {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 58px;
  padding: 10px; border: 1px dashed var(--border-color); border-radius: 8px;
  background: var(--bg-passage); margin-bottom: 12px;
}
.wordorder-zone.is-answer { border-style: solid; border-color: color-mix(in srgb, #f59e0b 55%, var(--border-color)); }
.wordorder-token, .matching-item {
  padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 7px;
  background: var(--option-bg); color: var(--option-text); cursor: pointer; font-size: 0.9rem;
}
.wordorder-token:hover, .matching-item:hover { border-color: var(--accent); background: var(--btn-hover-bg); }
.wordorder-placeholder { color: var(--text-muted); font-size: 0.82rem; }
.matching-board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px 14px; }
.matching-column { display: flex; flex-direction: column; gap: 8px; }
.matching-heading { color: var(--text-muted); font-size: 0.75rem; text-align: center; }
.matching-item { width: 100%; min-height: 48px; text-align: left; overflow-wrap: anywhere; }
.matching-item.active { border-color: #22c55e; background: color-mix(in srgb, #22c55e 14%, transparent); }
.matching-item.matched { border-color: var(--accent); }
.matching-item:disabled { cursor: default; opacity: 0.72; }
.dialogue-scene { display: grid; gap: 8px; margin-bottom: 14px; }
.dialogue-bubble {
  max-width: 88%; padding: 11px 14px; border-radius: 8px; line-height: 1.5;
  background: var(--bg-passage); color: var(--text-primary); border: 1px solid var(--border-light);
}
.dialogue-bubble.reply { margin-left: auto; border-color: color-mix(in srgb, #06b6d4 42%, var(--border-color)); color: #06b6d4; }

/* 反馈 */
.feedback-area { display: none; margin-bottom: 16px; }
.feedback-area.show { display: block; }
.feedback-correct { color: var(--success); font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; animation: correctPop 0.5s ease; }
.feedback-wrong { color: var(--danger); font-size: 0.95rem; font-weight: 600; margin-bottom: 8px; animation: wrongShake 0.5s ease; }
.feedback-correct, .feedback-wrong { display: flex; align-items: center; justify-content: center; gap: 6px; }
.feedback-explanation {
  background: var(--bg-passage); border-radius: 8px;
  padding: 10px 14px; font-size: 0.8rem; color: var(--text-secondary); line-height: 1.5;
}
@keyframes correctPop {
  0% { transform: scale(0.5); opacity: 0; }
  50% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-4px); }
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: 10px; font-size: 0.85rem; font-weight: 600;
  border: none; cursor: pointer;
  transition: background-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
  width: 100%;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-strong)); color: #071712; box-shadow: 0 4px 15px color-mix(in srgb, var(--accent) 22%, transparent); }
.btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 32%, transparent); }
.btn:disabled { cursor: not-allowed; opacity: 0.42; filter: saturate(0.35); box-shadow: none; transform: none; }
.btn:focus-visible, .option-btn:focus-visible, .diff-btn:focus-visible,
.header-action-btn:focus-visible, .theme-toggle:focus-visible {
  outline: 2px solid var(--reward); outline-offset: 2px;
}
.btn-secondary { background: var(--btn-bg); color: var(--text-secondary); border: 1px solid var(--border-color); }
.btn-secondary:hover { background: var(--btn-hover-bg); }
.question-actions { display: grid; gap: 10px; margin-top: 4px; }
.question-actions .btn { min-height: 46px; padding: 12px 20px; font-size: 0.92rem; }
.auto-advance-control {
  display: flex; align-items: center; justify-content: space-between; gap: 14px;
  min-height: 44px; padding: 9px 12px; border: 1px solid var(--border-color);
  border-radius: 8px; background: var(--bg-passage); color: var(--text-secondary);
  font-size: 0.78rem; cursor: pointer; user-select: none;
}
.auto-advance-control span { line-height: 1.35; }
.auto-advance-control input { width: 18px; height: 18px; flex: 0 0 auto; accent-color: var(--accent); cursor: pointer; }
.auto-advance-control:focus-within { outline: 2px solid var(--reward); outline-offset: 2px; }
.btn-close {
  background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer;
  padding: 4px 8px; line-height: 1;
}
.btn-close:hover { color: var(--text-title); }

/* 锁定提示 */
.locked-tip {
  text-align: center; color: var(--text-muted); padding: 20px 0;
  font-size: 0.9rem; line-height: 1.6;
}
#locked-tip-msg .lucide { width: 24px; height: 24px; margin-bottom: 6px; color: var(--text-secondary); }
.locked-tip-btn {
  margin-top: 16px;
  padding: 8px 24px;
  background: rgba(74, 230, 201, 0.15);
  border: 1px solid rgba(74, 230, 201, 0.3);
  border-radius: 8px;
  color: #4ae6c9;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.2s;
}
.locked-tip-btn:hover { background: rgba(74, 230, 201, 0.25); }

/* 锁定魔方格悬停提示 */
.lock-hover-tooltip {
  position: fixed;
  pointer-events: none;
  background: var(--bg-card-solid);
  border: 1px solid var(--border-color);
  border-radius: 6px;
  padding: 6px 12px;
  color: var(--text-secondary);
  font-size: 0.75rem;
  z-index: 1000;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.15s;
}
.lock-hover-tooltip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ============================================================
   响应式
   ============================================================ */
@media (max-width: 480px) {
  .header { padding: 6px 10px; }
  .header-top { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 6px 10px; }
  .header-title { font-size: 1rem; white-space: nowrap; }
  .difficulty-selector { justify-self: end; }
  .difficulty-menu {
    position: fixed; top: 46px; left: 10px; right: 10px; transform: none;
    width: auto; max-height: calc(100dvh - 58px);
  }
  .header-actions { grid-column: 1 / -1; justify-content: flex-start; width: 100%; }
  .modal-box { padding: 18px; width: 94%; }
  .question-actions { gap: 12px; }
  .question-actions .btn { min-height: 48px; }
  .auto-advance-control { padding: 10px 12px; }
  .face-progress { gap: 2px; }
  .face-progress-item { font-size: 0.6rem; padding: 2px 6px; }
  .diff-btn { padding: 2px 8px; font-size: 0.65rem; }
  .panel-header { height: 32px; padding: 0 10px; }
  .panel-icon { font-size: 0.85rem; }
  .panel-title { font-size: 0.65rem; }
  .panel-progress-text { font-size: 0.65rem; }
  .panel-percent { font-size: 0.6rem; min-width: 28px; }
  .header-action-btn { width: 30px; height: 30px; font-size: 0.8rem; }
  .header-diff-badge { font-size: 0.65rem; padding: 2px 8px; }
  .header-stats { font-size: 0.7rem; padding: 3px 8px; }

  /* 进度面板移动端适配：保持3列布局，紧凑模式 */
  .panel-body { gap: 2px; padding: 0 6px; }
  .panel-body.open { max-height: 78px; padding: 0 6px 5px; }
  .panel-body-row { gap: 4px; }
  .panel-body-item { font-size: 0.6rem; padding: 2px 4px; }
  .panel-body-dot { width: 6px; height: 6px; }
  .panel-reset-btn { font-size: 0.6rem; padding: 1px 3px; }
  .panel-reset-all { font-size: 0.65rem; padding: 4px 0; margin-top: 4px; }
}
</style>

        <span>魔方英语</span>
      </div>
      <div class="difficulty-selector" id="difficulty-selector">
        <button class="diff-btn active" id="difficulty-trigger" aria-haspopup="true" aria-expanded="false"><span id="difficulty-trigger-label">八年级</span><i data-lucide="chevron-down"></i></button>
        <div class="difficulty-menu" id="difficulty-menu" role="menu"></div>
      </div>
      <div class="header-actions">
        <button class="theme-toggle" id="theme-toggle" title="切换为亮色主题" aria-label="切换为亮色主题"><i data-lucide="sun"></i></button>
        <button class="header-action-btn" id="btn-wrong-book" title="错题本" aria-label="打开错题本"><i data-lucide="book-x"></i></button>
        <button class="header-action-btn" id="btn-stats" title="学习统计" aria-label="打开学习统计"><i data-lucide="chart-bar"></i></button>
        <button class="header-action-btn" id="btn-daily" title="今日挑战" aria-label="打开今日挑战"><i data-lucide="calendar-check-2"></i></button>
        <button class="header-action-btn" id="btn-share" title="分享游戏" aria-label="分享游戏"><i data-lucide="share-2"></i></button>
        <span class="header-diff-badge" id="header-diff-badge">初中</span>
        <div class="header-stats">已点亮 <span id="total-completed">0</span>/54 格</div>
      </div>
    </div>

    <!-- 悬浮迷你进度面板 -->
    <div class="progress-panel" id="progress-panel">
      <div class="panel-header" id="panel-header">
        <span class="panel-icon"><i data-lucide="chart-bar"></i></span>
        <span class="panel-title">总进度</span>
        <span class="panel-progress-text" id="panel-progress-text">0/54</span>
        <div class="panel-progress-bar">
          <div class="panel-progress-fill" id="panel-progress-fill" style="width:0%"></div>
        </div>
        <span class="panel-percent" id="panel-percent">0%</span>
        <button class="panel-toggle" id="panel-toggle" title="展开进度详情" aria-label="展开进度详情"><i data-lucide="chevron-right"></i></button>
      </div>
      <div class="panel-body" id="panel-body">
        <div class="panel-body-row" id="panel-body-row1"></div>
        <div class="panel-body-row" id="panel-body-row2"></div>
        <button class="panel-reset-all" id="panel-reset-all"><i data-lucide="rotate-ccw"></i>重置全部进度</button>
      </div>
    </div>
  </div>

  <!-- 3D 画布 -->
  <canvas id="cube-canvas"></canvas>

  <!-- 底部提示 -->
  <div class="hint-bar" id="hint-bar"><i data-lucide="hand"></i>拖动旋转 · 点击亮格答题</div>

  <!-- 确认对话框 -->
  <div class="confirm-overlay" id="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-box">
      <div class="confirm-title" id="confirm-title">确认操作</div>
      <div class="confirm-message" id="confirm-message"></div>
      <div class="confirm-checkbox" id="confirm-checkbox" style="display:none;margin-bottom:16px;">
        <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);font-size:0.8rem;cursor:pointer">
          <input type="checkbox" id="confirm-checkbox-input" checked style="accent-color:var(--accent)">
          <span id="confirm-checkbox-label">同时清空答题日志</span>
        </label>
      </div>
      <div class="confirm-buttons">
        <button class="confirm-btn confirm-btn-cancel" id="confirm-cancel">取消</button>
        <button class="confirm-btn confirm-btn-danger" id="confirm-ok">确认重置</button>
      </div>
      <div class="confirm-buttons" id="confirm-buttons-multi" style="display:none">
        <button class="confirm-btn confirm-btn-cancel" id="confirm-multi-cancel">取消</button>
        <button class="confirm-btn confirm-btn-warning" id="confirm-multi-current">重置当前难度</button>
        <button class="confirm-btn confirm-btn-danger" id="confirm-multi-all">重置所有难度</button>
      </div>
    </div>
  </div>

  <!-- 错题本 / 统计 / 每日挑战 通用弹窗 -->
  <div class="modal-overlay" id="panel-overlay" role="dialog" aria-modal="true" aria-labelledby="panel-title">
    <div class="modal-box" id="panel-box" style="max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <span style="font-size:1.1rem;font-weight:700;color:var(--text-title)" id="panel-title">面板</span>
        <button class="btn-close" id="btn-panel-close" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
      </div>
      <div id="panel-content"></div>
    </div>
  </div>

  <!-- 通关证书弹窗 -->
  <div class="modal-overlay" id="cert-overlay" role="dialog" aria-modal="true" aria-labelledby="cert-title">
    <div class="modal-box" id="cert-box" style="text-align:center;border:2px solid rgba(230,200,154,0.3);box-shadow:0 0 60px rgba(230,200,154,0.15)">
      <div style="color:var(--reward);margin-bottom:8px"><i data-lucide="award" style="width:48px;height:48px"></i></div>
      <div id="cert-title" style="font-size:1.3rem;font-weight:700;color:var(--reward);margin-bottom:4px">语法大师 · 通关证书</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:12px"><i data-lucide="sparkles"></i>恭喜完成全部 54 关！</div>
      <input id="cert-name" style="background:var(--option-bg);border:1px solid var(--border-color);border-radius:8px;color:var(--text-title);padding:6px 12px;text-align:center;width:200px;margin-bottom:8px;font-size:0.9rem" value="探险家">
      <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:4px">完成时间：<span id="cert-time" style="color:var(--accent)">-</span></div>
      <div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:12px">总正确率：<span id="cert-accuracy" style="color:var(--accent)">-</span></div>
      <div id="cert-faces" style="margin-bottom:16px;text-align:left"></div>
      <div style="display:flex;gap:8px;justify-content:center">
        <button class="confirm-btn" style="background:var(--btn-bg);color:var(--text-secondary);border:1px solid var(--border-color)" id="btn-cert-close">关闭</button>
        <button class="confirm-btn confirm-btn-danger" id="btn-cert-share" style="background:linear-gradient(135deg,var(--accent),var(--accent-strong));color:#0a1628"><i data-lucide="share-2"></i>分享</button>
      </div>
    </div>
  </div>

  <!-- 答题弹窗 -->
  <div class="modal-overlay" id="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <div class="modal-face-badge" id="modal-face-badge">语法核心</div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="modal-level" id="modal-level">小学</span>
          <button class="btn-close" id="btn-close-modal" title="关闭" aria-label="关闭"><i data-lucide="x"></i></button>
        </div>
      </div>
      <div class="modal-title" id="modal-title">第1关：一般现在时</div>
      <div class="level-question-progress" id="level-question-progress">
        <div class="level-question-track"><div class="level-question-fill" id="level-question-fill"></div></div>
        <span id="level-question-count">1/5</span>
      </div>
      <div class="modal-passage" id="modal-passage" style="display:none"></div>
      <div class="modal-question" id="modal-question"></div>
      <div class="options-list" id="options-list"></div>
      <div class="feedback-area" id="feedback-area">
        <div id="feedback-message"></div>
        <div class="feedback-explanation" id="feedback-explanation"></div>
      </div>
      <div class="question-actions" id="question-actions">
        <button class="btn btn-primary" id="btn-submit">提交答案</button>
        <button class="btn btn-primary" id="btn-next" style="display:none">下一题</button>
        <label class="auto-advance-control" for="auto-advance-input">
          <span>自动进入下一题/关（展示答案 2 秒）</span>
          <input type="checkbox" id="auto-advance-input" checked>
        </label>
      </div>
      <div class="locked-tip" id="locked-tip" style="display:none">
        <div id="locked-tip-msg"></div>
        <button class="locked-tip-btn" id="locked-tip-btn">知道了</button>
      </div>
    </div>
  </div>
</div>

<!-- 锁定魔方格悬停提示 -->
<div class="lock-hover-tooltip" id="lock-hover-tooltip">完成前一关解锁</div>

</body>
</html>
